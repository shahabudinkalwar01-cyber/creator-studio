<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Cartoon & Creator Studio</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #090b12; color: #fff; padding-bottom: 50px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px; background: #0f131f; border-bottom: 1px solid #22293a; position: sticky; top: 0; z-index: 50; }
    .tab-btn { padding: 7px 14px; border-radius: 20px; border: 1px solid #2d364d; background: #161c2c; color: #fff; font-weight: 700; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .tab-btn.active { background: #f5b942; color: #000; border-color: #f5b942; }
    .card { margin: 12px; padding: 14px; background: #121724; border: 1px solid #232b3e; border-radius: 14px; }
    h3 { margin: 0 0 10px 0; font-size: 13px; color: #f5b942; text-transform: uppercase; letter-spacing: 0.5px; }
    textarea { width: 100%; height: 90px; background: #090c14; color: #fff; border: 1px solid #2e374d; border-radius: 10px; padding: 10px; font-size: 14px; resize: none; }
    .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
    .btn { flex: 1; padding: 11px; border: none; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; min-width: 110px; }
    .btn-gold { background: #f5b942; color: #000; }
    .btn-green { background: #10b981; color: #000; }
    .btn-red { background: #ef4444; color: #fff; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-dark { background: #1f2638; color: #fff; border: 1px solid #323c54; }
    #stageWrap { position: relative; width: 100%; max-width: 340px; aspect-ratio: 9/16; margin: 0 auto; border-radius: 14px; overflow: hidden; border: 2px solid #f5b942; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    .scene-card { background: #192030; border: 1px solid #2f384f; border-radius: 10px; padding: 10px; margin-top: 8px; }
    .scene-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; }
    select, input[type="text"] { background: #0c0f18; color: #fff; border: 1px solid #323b52; border-radius: 6px; padding: 5px 8px; font-size: 12px; }
    input[type="text"] { width: 100%; }
  </style>
</head>
<body>

  <!-- TOP 5 CREATOR TABS -->
  <div class="tabs" id="categoryTabs">
    <button class="tab-btn active" data-mode="cartoon">🧸 3D Cartoon</button>
    <button class="tab-btn" data-mode="iman">💰 Iman Wealth</button>
    <button class="tab-btn" data-mode="story">🎬 Action Story</button>
    <button class="tab-btn" data-mode="song">🎵 Song & Beat</button>
    <button class="tab-btn" data-mode="cyber">🔷 Cyber AI</button>
  </div>

  <!-- CARD 1: SCRIPT, MIC RECORDING & STUDIO BASS -->
  <div class="card">
    <h3>1. Script, Voice Record or Upload Audio</h3>
    <textarea id="scriptBox">One sunny morning, Leo walked through the green jungle. Suddenly he saw a rocket flying into outer space! Next he swam across the blue ocean and met his best friend in the city.</textarea>

    <div style="margin-top:10px; padding:10px; background:#0d1019; border:1px solid #f5b942; border-radius:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; font-weight:700; color:#f5b942;">🎙️ PC Studio Bass Voice Enhancer</span>
        <button id="bassToggle" class="btn-green" style="border:none; border-radius:6px; padding:4px 10px; font-weight:700; font-size:11px;">ON (+8 dB)</button>
      </div>
      <div class="row" style="margin-top:6px;">
        <span style="font-size:11px; color:#9ca3af;">Deep Bass:</span>
        <input id="bassSlider" type="range" min="0" max="14" value="8" style="flex:1; accent-color:#f5b942;">
      </div>
    </div>

    <div class="row">
      <button id="recordMicBtn" class="btn btn-red">🎤 Record Voice</button>
      <button id="uploadAudioBtn" class="btn btn-dark">📁 Upload Audio</button>
      <input id="audioFileInput" type="file" accept="audio/*" style="display:none;">
    </div>
    <div class="row">
      <button id="generateBtn" class="btn btn-gold">✨ Build 3D Cartoon Video</button>
    </div>
  </div>

  <!-- CARD 2: LIVE 3D CARTOON & MOTION STAGE -->
  <div class="card">
    <h3>2. Live 3D Stage & Video Export</h3>
    <div id="stageWrap">
      <canvas id="stageCanvas" width="360" height="640"></canvas>
    </div>
    <div class="row">
      <button id="playBtn" class="btn btn-green">▶ Play Video</button>
      <button id="exportBtn" class="btn btn-blue">⬇️ Export Video</button>
    </div>
    <div id="statusText" style="margin-top:8px; font-size:12px; color:#10b981; text-align:center;">100% Ready — Zero downloads, works offline!</div>
  </div>

  <!-- CARD 3: EDIT OR REMOVE SCENES BEFORE EXPORT -->
  <div class="card">
    <h3>3. Edit or Remove Scenes Before Export</h3>
    <div id="sceneList"></div>
  </div>

<script>
  const canvas = document.getElementById("stageCanvas");
  const ctx = canvas.getContext("2d");

  let scenes = [];
  let currentScene = { text: "READY TO CREATE", env: "jungle", twoChars: false };
  let isPlaying = false;
  let playStart = 0;
  let audioUrl = null;
  let audioEl = null;

  // === 1. SCRIPT-TO-SCENE ENGINE (DETECTS PLACES & CHARACTERS FROM WORDS) ===
  function compileScript() {
    const raw = document.getElementById("scriptBox").value.trim();
    const parts = raw.split(/(?<=[.!?])|\b(?=next\b|then\b|suddenly\b|and\b)/i).map(s => s.trim()).filter(Boolean);
    let cursor = 0;

    scenes = parts.map((text, i) => {
      const dur = Math.max(1.8, text.split(/\s+/).length * 0.44);
      const low = text.toLowerCase();
      let env = "jungle";
      if (/space|moon|rocket|star|planet/.test(low)) env = "space";
      else if (/ocean|sea|water|swim|river/.test(low)) env = "ocean";
      else if (/city|street|karachi|car|school|road/.test(low)) env = "city";
      else if (/money|rich|gold|iman|business|win|grow/.test(low)) env = "wealth";

      const twoChars = /friend|meet|people|talk|fight|rival|two/.test(low);
      const item = { id: i, text, env, twoChars, start: cursor, end: cursor + dur };
      cursor += dur;
      return item;
    });

    if (scenes.length > 0) currentScene = scenes.at(0);
    renderSceneCards();
  }

  // === 2. DRAW 3D-SHADED CARTOON ENVIRONMENTS, CHARACTERS & CAPTIONS ===
  function draw3DTree(x, y, scale) {
    ctx.fillStyle = "#78350f";
    ctx.fillRect(x - 8 * scale, y, 16 * scale, 55 * scale);
    ctx.fillStyle = "#15803d";
    ctx.beginPath(); ctx.arc(x, y - 15 * scale, 38 * scale, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#22c55e";
    ctx.beginPath(); ctx.arc(x - 10 * scale, y - 25 * scale, 26 * scale, 0, Math.PI * 2); ctx.fill();
  }

  function drawCartoonHero(x, y, shirtColor, capColor, t, speaking, flip) {
    const bounce = speaking ? Math.abs(Math.sin(t * 7)) * 14 : Math.sin(t * 2) * 3;
    const armWave = speaking ? Math.sin(t * 10) * 0.6 : 0.2;
    const cy = y - bounce;

    // Shadow on 3D ground
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath(); ctx.ellipse(x, y + 65, 34, 10, 0, 0, Math.PI * 2); ctx.fill();

    // Legs
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(x - 16, cy + 32, 11, 32);
    ctx.fillRect(x + 5, cy + 32, 11, 32);

    // Waving Arms
    ctx.save();
    ctx.translate(x - 24, cy + 5);
    ctx.rotate(0.4 + armWave);
    ctx.fillStyle = shirtColor;
    ctx.fillRect(-6, 0, 12, 34);
    ctx.restore();

    ctx.save();
    ctx.translate(x + 24, cy + 5);
    ctx.rotate(-0.4 - armWave);
    ctx.fillStyle = shirtColor;
    ctx.fillRect(-6, 0, 12, 34);
    ctx.restore();

    // 3D Shaded Torso
    const bodyGrad = ctx.createLinearGradient(x - 25, cy, x + 25, cy + 40);
    bodyGrad.addColorStop(0, shirtColor);
    bodyGrad.addColorStop(1, "#0f172a");
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.roundRect(x - 22, cy - 5, 44, 42, 14); ctx.fill();

    // Big 3D Cartoon Head
    const headGrad = ctx.createRadialGradient(x - 10, cy - 45, 5, x, cy - 35, 38);
    headGrad.addColorStop(0, "#ffedd5");
    headGrad.addColorStop(1, "#fdba74");
    ctx.fillStyle = headGrad;
    ctx.beginPath(); ctx.arc(x, cy - 35, 34, 0, Math.PI * 2); ctx.fill();

    // Big Expressive Eyes
    const eyeOffset = flip ? -4 : 4;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x - 11 + eyeOffset, cy - 38, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 11 + eyeOffset, cy - 38, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0f172a";
    ctx.beginPath(); ctx.arc(x - 10 + eyeOffset, cy - 38, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 12 + eyeOffset, cy - 38, 4, 0, Math.PI * 2); ctx.fill();

    // Animated Talking Mouth
    ctx.fillStyle = "#991b1b";
    const mouthH = speaking ? 4 + Math.abs(Math.sin(t * 14)) * 9 : 4;
    ctx.beginPath(); ctx.ellipse(x + eyeOffset, cy - 20, 8, mouthH, 0, 0, Math.PI * 2); ctx.fill();

    // Cartoon Cap
    ctx.fillStyle = capColor;
    ctx.beginPath(); ctx.arc(x, cy - 42, 34, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - 34, cy - 45, 74, 7);
  }

  function renderFrame() {
    const t = performance.now() * 0.001;
    const env = currentScene.env;

    // 1. DRAW 3D ENVIRONMENT BACKDROP
    if (env === "jungle") {
      const sky = ctx.createLinearGradient(0, 0, 0, 420);
      sky.addColorStop(0, "#0284c7"); sky.addColorStop(1, "#7dd3fc");
      ctx.fillStyle = sky; ctx.fillRect(0, 0, 360, 640);
      ctx.fillStyle = "#fde047"; ctx.beginPath(); ctx.arc(290, 85, 32, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#22c55e"; ctx.beginPath(); ctx.ellipse(180, 520, 280, 170, 0, 0, Math.PI * 2); ctx.fill();
      draw3DTree(65, 350, 1.1);
      draw3DTree(295, 365, 0.9);
    } else if (env === "space") {
