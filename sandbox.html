<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{box-sizing:border-box;font-family:sans-serif}
    body{margin:0;background:#090b12;color:#fff;padding:10px}
    .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
    .tab{padding:7px 12px;border-radius:18px;border:none;background:#1a2030;color:#fff;font-weight:700;font-size:12px;white-space:nowrap}
    .tab.on{background:#f5b942;color:#000}
    .box{background:#121724;border:1px solid #252e42;border-radius:12px;padding:12px;margin-bottom:12px}
    textarea{width:100%;height:75px;background:#090c14;color:#fff;border:1px solid #303a52;border-radius:8px;padding:8px;font-size:13px}
    .row{display:flex;gap:8px;margin-top:8px}
    button.btn{flex:1;padding:10px;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
    canvas{display:block;width:270px;height:480px;margin:0 auto;border:2px solid #f5b942;border-radius:12px;background:#000}
    .sc{background:#1a2133;padding:8px;border-radius:8px;margin-top:6px;font-size:12px}
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab on" onclick="setMode('jungle',this)">🧸 3D Cartoon</button>
    <button class="tab" onclick="setMode('wealth',this)">💰 Iman Wealth</button>
    <button class="tab" onclick="setMode('space',this)">🚀 Space AI</button>
    <button class="tab" onclick="setMode('ocean',this)">🌊 Ocean</button>
    <button class="tab" onclick="setMode('city',this)">🏙️ City</button>
  </div>

  <div class="box">
    <textarea id="txt">Leo walked in the green jungle. Next a rocket flew into space! Then he swam in the ocean and met his friend in the city.</textarea>
    <div class="row">
      <button class="btn" style="background:#ef4444;color:#fff" id="micBtn">🎤 Record Voice</button>
      <button class="btn" style="background:#1f2937;color:#fff" onclick="document.getElementById('audIn').click()">📁 Audio</button>
      <input type="file" id="audIn" accept="audio/*" style="display:none">
    </div>
    <div class="row">
      <button class="btn" style="background:#f5b942;color:#000" onclick="build()">✨ Build 3D Video</button>
      <button class="btn" style="background:#10b981;color:#000" onclick="play()">▶ Play</button>
      <button class="btn" style="background:#2563eb;color:#fff" onclick="exp()">⬇️ Export</button>
    </div>
    <div id="st" style="font-size:11px;color:#10b981;margin-top:6px;text-align:center">Ready!</div>
  </div>

  <div class="box"><canvas id="cv" width="270" height="480"></canvas></div>
  <div class="box" id="list"></div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let scenes=[],cur={text:'READY',env:'jungle',two:false},playing=false,audUrl=null,rec=null,chunks=[];

function setMode(e,el){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  cur={text:e.toUpperCase()+' MODE',env:e,two:e==='city'};
}

function build(){
  const raw=document.getElementById('txt').value.trim();
  const arr=raw.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  let t=0;
  scenes=arr.map((s,i)=>{
    const d=Math.max(1.8,s.split(' ').length*0.45),l=s.toLowerCase();
    let env='jungle';
    if(/space|moon|rocket|star/.test(l))env='space';
    else if(/ocean|sea|water|swim/.test(l))env='ocean';
    else if(/city|street|karachi|car/.test(l))env='city';
    else if(/money|rich|gold|iman|win/.test(l))env='wealth';
    const two=/friend|meet|two|talk|fight/.test(l);
    const o={id:i,text:s,env,two,start:t,end:t+d};t+=d;return o;
  });
  if(scenes.length)cur=scenes[0];
  renderCards();
  document.getElementById('st').textContent='Built '+scenes.length+' Scenes!';
}

function renderCards(){
  const box=document.getElementById('list');box.innerHTML='';
  scenes.forEach((s,i)=>{
    const d=document.createElement('div');d.className='sc';
    d.innerHTML='<b>Scene '+(i+1)+' ('+s.env+')</b> <button style="float:right;background:#dc2626;color:#fff;border:none;border-radius:4px" onclick="delSc('+i+')">🗑️</button><br>'+s.text;
    box.appendChild(d);
  });
}
function delSc(i){scenes.splice(i,1);document.getElementById('txt').value=scenes.map(s=>s.text).join('. ');build();}

document.getElementById('micBtn').onclick=async function(){
  if(!rec||rec.state==='inactive'){
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(st);chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{audUrl=URL.createObjectURL(new Blob(chunks));document.getElementById('st').textContent='Voice Saved!';};
    rec.start();this.textContent='⏹️ Stop';
  }else{rec.stop();this.textContent='🎤 Record Voice';}
};
document.getElementById('audIn').onchange=e=>{if(e.target.files[0]){audUrl=URL.createObjectURL(e.target.files[0]);document.getElementById('st').textContent='Audio Loaded!';}};

function hero(x,y,col,t,flip){
  const b=playing?Math.abs(Math.sin(t*7))*12:0;
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x,y+50,26,8,0,0,7);ctx.fill();
  ctx.fillStyle='#1e293b';ctx.fillRect(x-12,y+24-b,8,25);ctx.fillRect(x+4,y+24-b,8,25);
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x-18,y-6-b,36,34,10);ctx.fill();
  ctx.fillStyle='#fed7aa';ctx.beginPath();ctx.arc(x,y-28-b,25,0,7);ctx.fill();
  const ox=flip?-3:3;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-8+ox,y-30-b,6,0,7);ctx.arc(x+8+ox,y-30-b,6,0,7);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x-8+ox,y-30-b,3,0,7);ctx.arc(x+8+ox,y-30-b,3,0,7);ctx.fill();
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(x,y-33-b,25,Math.PI,0);ctx.fill();
}

function draw(){
  const t=performance.now()*0.001,e=cur.env;
  ctx.fillStyle=e==='space'?'#050816':e==='wealth'?'#090a0f':e==='city'?'#1e293b':'#38bdf8';
  ctx.fillRect(0,0,270,480);
  if(e==='jungle'){
    ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(220,60,24,0,7);ctx.fill();
    ctx.fillStyle='#22c55e';ctx.beginPath();ctx.ellipse(135,410,200,110,0,0,7);ctx.fill();
    ctx.fillStyle='#78350f';ctx.fillRect(42,270,12,45);ctx.fillStyle='#15803d';ctx.beginPath();ctx.arc(48,255,28,0,7);ctx.fill();
  }else if(e==='space'){
    ctx.fillStyle='#a855f7';ctx.beginPath();ctx.arc(200,90,28,0,7);ctx.fill();
    ctx.fillStyle='#475569';ctx.beginPath();ctx.ellipse(135,410,200,110,0,0,7);ctx.fill();
  }else if(e==='ocean'){
    ctx.fillStyle='#0284c7';ctx.fillRect(0,280,270,200);
    ctx.fillStyle='#fde047';ctx.beginPath();ctx.ellipse(135,380,140,60,0,0,7);ctx.fill();
  }else if(e==='city'){
    ctx.fillStyle='#334155';ctx.fillRect(20,130,65,200);ctx.fillRect(185,110,70,220);
    ctx.fillStyle='#0f172a';ctx.fillRect(0,320,270,160);
  }else{
    ctx.fillStyle='#f5b942';ctx.fillRect(185,180,18,60);ctx.fillRect(210,150,18,90);
    ctx.fillStyle='#10b981';ctx.fillRect(235,110,18,130);
  }
  if(cur.two){hero(90,320,'#f97316',t,false);hero(185,320,'#3b82f6',t+1,true);}
  else hero(135,320,'#f97316',t,false);

  ctx.font='900 16px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;
  const w=cur.text.toUpperCase().split(' '),last=w.pop()||'';
  ctx.strokeText(w.slice(0,4).join(' '),135,415);ctx.fillText(w.slice(0,4).join(' '),135,415);
  ctx.fillStyle='#f5b942';ctx.fillRect(65,428,140,26);
  ctx.fillStyle='#000';ctx.fillText(last,135,446);
  requestAnimationFrame(draw);
}

function play(save){
  build();if(!scenes.length)return;
  speechSynthesis.cancel();
  if(audUrl)new Audio(audUrl).play();
  else speechSynthesis.speak(new SpeechSynthesisUtterance(scenes.map(s=>s.text).join('. ')));
  playing=true;const st=performance.now();
  let vr=null,vc=[];
  if(save){
    vr=new MediaRecorder(cv.captureStream(30));
    vr.ondataavailable=e=>vc.push(e.data);
    vr.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(vc,{type:'video/webm'}));a.download='Cartoon.webm';a.click();};
    vr.start();
  }
  const iv=setInterval(()=>{
    const sec=(performance.now()-st)/1000;
    const f=scenes.find(s=>sec>=s.start&&sec<s.end);
    if(f)cur=f;
    if(sec>=scenes[scenes.length-1].end){clearInterval(iv);playing=false;if(vr)vr.stop();}
  },100);
}
function exp(){document.getElementById('st').textContent='Exporting...';play(true);}
build();draw();
</script>
</body>
</html>
