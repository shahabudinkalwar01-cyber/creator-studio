<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com"></script>
</head>
<body style="margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:15px;">
  <button id="testBtn" style="padding:14px 24px;font-size:16px;background:#f5b942;border:none;border-radius:10px;font-weight:bold;">Tap Me to Change 3D Color</button>
  <p id="msg">Waiting...</p>
  <canvas id="c" style="width:280px;height:420px;border:2px solid #f5b942;border-radius:12px;"></canvas>
  <script>
    const msg = document.getElementById("msg");
    msg.textContent = "Step 1 OK: Script Started!";
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c") });
    renderer.setSize(280, 420, false);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#38bdf8");
    const cam = new THREE.PerspectiveCamera(45, 280/420, 0.1, 50);
    cam.position.z = 3;
    const box = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshNormalMaterial());
    scene.add(box);
    document.getElementById("testBtn").onclick = function() {
      scene.background = new THREE.Color("#22c55e");
      msg.textContent = "Button Works! Green 3D World!";
    };
    function loop() {
      requestAnimationFrame(loop);
      box.rotation.y += 0.03;
      renderer.render(scene, cam);
    }
    loop();
  </script>
</body>
</html>
