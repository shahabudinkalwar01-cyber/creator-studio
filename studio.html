<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio v16 — 4-Style 3D Video Generator</title>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <style>
    :root{--bg:#07090e;--card:#10141f;--input:#0a0e17;--border:#21293b;--gold:#f5c542;--text:#f8fafc;--muted:#94a3b8;--green:#10b981;--red:#ef4444;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
    body{background:var(--bg);color:var(--text);padding:14px 12px 50px;}
    .container{max-width:680px;margin:0 auto;}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
    .badge{font-size:11px;font-weight:700;color:var(--gold);border:1px solid rgba(245,197,66,0.4);background:rgba(245,197,66,0.08);padding:5px 11px;border-radius:999px;}
    .back-link{color:var(--muted);text-decoration:none;font-size:0.85rem;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:13px;}
    .step-title{font-size:0.78rem;font-weight:700;color:var(--gold);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:9px;}
    textarea{width:100%;min-height:92px;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:0.95rem;line-height:1.45;resize:vertical;margin-bottom:10px;}
    .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px;}
    .mic-btn{background:#1f1622;color:#fca5a5;border:1px solid rgba(239,68,68,0.4);border-radius:11px;padding:10px;font-size:0.84rem;font-weight:700;cursor:pointer;}
    .mic-btn.recording{background:var(--red);color:#fff;}
    .upload-mini{display:flex;align-items:center;justify-content:center;background:var(--input);color:var(--text);border:1px dashed #374151;border-radius:11px;padding:10px;font-size:0.84rem;font-weight:600;cursor:pointer;}
    input[type="file"]{display:none;}
    .btn-gen{width:100%;background:linear-gradient(90deg,#f5c542,#fbbf24);color:#07090e;border:none;border-radius:12px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;}
    .var-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
    .var-card{background:var(--input);border:1.5px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;text-align:left;}
    .var-card.active{border-color:var(--gold);background:rgba(245,197,66,0.08);}
    .var-card strong{display:block;font-size:0.9rem;margin-bottom:3px;color:var(--text);}
    .var-card span{font-size:0.74rem;color:var(--muted);}
    canvas{width:100%;aspect-ratio:9/16;max-height:490px;object-fit:contain;background:#000;border-radius:12px;border:1px solid var(--border);display:block;margin:0 auto 12px;}
    .controls-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
    .status{font-size:0.8rem;color:var(--green);flex:1;min-width:170px;}
    .btn-small{background:#1e293b;color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:8px;font-size:0.84rem;font-weight:600;cursor:pointer;}
    .btn-export{background:var(--green);color:#052e16;border:none;}
    .btn-small:disabled{opacity:0.5;}
    .scene-row{background:var(--input);border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:9px;}
    .scene-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
    .scene-head input[type="text"]{flex:1;background:#111827;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:0.84rem;}
    .chk-lbl{display:flex;align-items:center;gap:5px;font-size:0.78rem;font-weight:700;color:var(--gold);white-space:nowrap;cursor:pointer;}
    .chk-lbl input{width:17px;height:17px;accent-color:var(--gold);}
    .row-tools{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;}
    .row-tools select{background:#111827;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px;font-size:0.76rem;}
    .pic-btn{background:#1e293b;color:#7dd3fc;border:1px solid #0284c7;border-radius:8px;padding:6px 9px;font-size:0.75rem;font-weight:700;cursor:pointer;white-space:nowrap;}
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <span class="badge">UNLIMITED 3D STUDIO v16</span>
      <a href="index.html" class="back-link">← Home</a>
    </div>

    <!-- 1. Clean Script Box + Optional Mic/Audio -->
    <div class="card">
      <div class="step-title">1. Paste Script or Add Voice</div>
      <textarea id="scriptInput">95% of creators waste 10 hours on their phone. In 2026, smart AI systems build a $10,000 empire fast. Celebrate every win around the world!</textarea>
      <div class="btn-row">
        <button class="mic-btn" id="micBtn">🎙️ Record Voice (Free)</button>
        <label class="upload-mini"><input type="file" id="audioUpload" accept="audio/*" /><span id="audioLabel">📁 Upload Audio (Optional)</span></label>
      </div>
      <button class="btn-gen" id="generateBtn">✨ Generate 4 Different Videos</button>
    </div>

    <!-- 2. Pick 1 of 4 Generated Video Styles -->
    <div class="card" id="variantsCard" style="display:none;">
      <div class="step-title">2. Choose Your Favorite Video (4 Styles)</div>
      <div class="var-grid">
        <button class="var-card active" data-var="0"><strong>🎬 1. Dark Luxury</strong><span>Gold • Coins/Watch • Orbit • Trap</span></button>
        <button class="var-card" data-var="1"><strong>🤖 2. Cyber 3D Bot</strong><span>Cyan • Blender Robot • Whip • Synth</span></button>
        <button class="var-card" data-var="2"><strong>📈 3. Neon Finance</strong><span>Emerald • 3D Bars • Low Angle • Ambient</span></button>
        <button class="var-card" data-var="3"><strong>🔥 4. Viral Impact</strong><span>Crimson • Glitch Cuts • Pullback • Heartbeat</span></button>
      </div>
    </div>

    <!-- 3. Preview & Export -->
    <div class="card">
      <div class="step-title">3. Live Preview & Free MP4 Export</div>
      <canvas id="previewCanvas" width="720" height="1280"></canvas>
      <div class="controls-row">
        <span class="status" id="statusText">Paste script & tap Generate 4 Different Videos</span>
        <div style="display:flex;gap:8px;">
          <button class="btn-small" id="replayBtn">Replay</button>
          <button class="btn-small btn-export" id="exportBtn">Export MP4</button>
        </div>
      </div>
    </div>

    <!-- 4. Editable Scene Rows -->
    <div class="card" id="editorCard" style="display:none;">
      <div class="step-title">4. Edit Any Scene (Hide/Show 3D, Change Object, Camera & FX)</div>
      <div id="sceneRowsContainer"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const canvas = document.getElementById("previewCanvas"), ctx = canvas.getContext("2d");
    const statusText = document.getElementById("statusText"), scriptInput = document.getElementById("scriptInput");
    const variantsCard = document.getElementById("variantsCard"), editorCard = document.getElementById("editorCard");
    const rowsBox = document.getElementById("sceneRowsContainer"), exportBtn = document.getElementById("exportBtn"), micBtn = document.getElementById("micBtn");

    // --- THREE.JS 3D STAGE ---
    const threeRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
    threeRenderer.setSize(540, 960); threeRenderer.outputColorSpace = THREE.SRGBColorSpace;
    const threeScene = new THREE.Scene();
    const threeCam = new THREE.PerspectiveCamera(44, 540/960, 0.1, 100);
    const camPos = new THREE.Vector3(0, 1.0, 4.0), camLook = new THREE.Vector3(0, 0.1, 0);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x111827, 1.6);
    const keyL = new THREE.DirectionalLight(0xffffff, 2.3); keyL.position.set(3, 6, 4);
    const rimL = new THREE.DirectionalLight(0xf5c542, 2.5); rimL.position.set(-4, 4, -3);
    const propL = new THREE.PointLight(0xf5c542, 3.0, 6); propL.position.set(0, 0.5, 1.2);
    threeScene.add(hemi, keyL, rimL, propL);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(24,24), new THREE.MeshStandardMaterial({color:0x06080f,roughness:0.25,metalness:0.7,transparent:true,opacity:0.82}));
    floor.rotation.x = -Math.PI/2; floor.position.y = -1.0;
    const grid = new THREE.GridHelper(22, 26, 0xf5c542, 0x1e293b); grid.position.y = -0.99;
    threeScene.add(floor, grid);

    // Build Reusable 3D Objects on Stage
    const darkMat = new THREE.MeshStandardMaterial({color:0x0f172a,roughness:0.3,metalness:0.8});
    const neonMat = new THREE.MeshBasicMaterial({color:0xf5c542});
    const goldMat = new THREE.MeshStandardMaterial({color:0xf5c542,roughness:0.2,metalness:0.9});

    const objs3D = {};
    function makeGroup(name){ const g = new THREE.Group(); g.visible = false; threeScene.add(g); objs3D[name] = g; return g; }

    // 1. Coins
    const cg = makeGroup("coins");
    for(let i=0;i<5;i++){ const m=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,0.1,24),goldMat); m.position.set((i%2)*0.08, -0.7+i*0.14, 0); cg.add(m); }
    // 2. Phone
    const pg = makeGroup("phone");
    pg.add(new THREE.Mesh(new THREE.BoxGeometry(0.95,1.75,0.1),darkMat));
    const ps=new THREE.Mesh(new THREE.PlaneGeometry(0.82,1.55),neonMat); ps.position.z=0.06; pg.add(ps);
    // 3. Laptop
    const lg = makeGroup("laptop");
    const lb=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.06,0.9),darkMat); lb.position.y=-0.35; lg.add(lb);
    const ll=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.9,0.05),darkMat); ll.position.set(0,0.08,-0.45); ll.rotation.x=-0.2; lg.add(ll);
    const ls=new THREE.Mesh(new THREE.PlaneGeometry(1.26,0.76),neonMat); ls.position.set(0,0.08,-0.41); ls.rotation.x=-0.2; lg.add(ls);
    // 4. Bars
    const bg = makeGroup("bars");
    for(let i=0;i<4;i++){ const h=0.45+i*0.4; const b=new THREE.Mesh(new THREE.BoxGeometry(0.32,h,0.32),goldMat); b.position.set(-0.68+i*0.45, -1.0+h/2, 0); bg.add(b); }
    // 5. Trophy / Diamond
    const tg = makeGroup("trophy");
    tg.add(new THREE.Mesh(new THREE.OctahedronGeometry(0.68, 0), goldMat));
    // 6. Watch
    const wg = makeGroup("watch");
    wg.add(new THREE.Mesh(new THREE.BoxGeometry(0.45,2.0,0.12),darkMat));
    const wr=new THREE.Mesh(new THREE.CylinderGeometry(0.65,0.65,0.18,28),goldMat); wr.rotation.x=Math.PI/2; wg.add(wr);
    const wf=new THREE.Mesh(new THREE.CircleGeometry(0.54,28),darkMat); wf.position.z=0.1; wg.add(wf);
    // 7. Globe
    const gg = makeGroup("globe");
    gg.add(new THREE.Mesh(new THREE.SphereGeometry(0.78,16,12), new THREE.MeshBasicMaterial({color:0xf5c542,wireframe:true})));
    // 8. Cube
    const cbg = makeGroup("cube");
    cbg.add(new THREE.Mesh(new THREE.BoxGeometry(1.1,1.1,1.1), new THREE.MeshBasicMaterial({color:0xf5c542,wireframe:true})));

    // 9. Blender GLB Robot
    const loader = new GLTFLoader();
    let botModel = null, botMixer = null, botActs = {}, botCur = "", botReady = false;
    loader.load("https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/models/gltf/RobotExpressive/RobotExpressive.glb", gltf => {
      botModel = gltf.scene;
      const box = new THREE.Box3().setFromObject(botModel);
      const md = Math.max(...box.getSize(new THREE.Vector3()).toArray()) || 1;
      botModel.scale.setScalar(2.0 / md); box.setFromObject(botModel);
      const c = box.getCenter(new THREE.Vector3());
      botModel.position.set(-c.x, -box.min.y - 1.0, -c.z);
      botModel.visible = false; threeScene.add(botModel);
      botMixer = new THREE.AnimationMixer(botModel);
      gltf.animations.forEach(cl => { botActs[cl.name] = botMixer.clipAction(cl); });
      botReady = true;
    });

    function playBotAnim(name) {
      if (!botReady || !botActs[name] || botCur === name) return;
      if (botCur && botActs[botCur]) botActs[botCur].fadeOut(0.2);
      botActs[name].reset().fadeIn(0.2).play(); botCur = name;
    }

    // --- 4 DISTINCT VIDEO PRESETS ---
    const VARIATIONS = [
      { name:"Dark Luxury", bg:"#0b0803", accent:"#f5c542", hex:0xf5c542, glow:"rgba(245,197,66,0.38)", bgm:"Dark Trap", defCam:"orbit", defFx:"shockwave", defObj:"coins" },
      { name:"Cyber 3D Bot", bg:"#051024", accent:"#38bdf8", hex:0x38bdf8, glow:"rgba(56,189,248,0.38)", bgm:"Cyber Synth", defCam:"zoom_in", defFx:"flash", defObj:"robot" },
      { name:"Neon Finance", bg:"#02140d", accent:"#10b981", hex:0x10b981, glow:"rgba(16,185,129,0.38)", bgm:"Tech Ambient", defCam:"pan", defFx:"shockwave", defObj:"bars" },
      { name:"Viral Impact", bg:"#140507", accent:"#ef4444", hex:0xef4444, glow:"rgba(239,68,68,0.38)", bgm:"Doc Heartbeat", defCam:"pull_back", defFx:"glitch", defObj:"watch" }
    ];
    const WORD_ENV_HEX = { coins:0xf5c542, phone:0x38bdf8, bars:0x10b981, trophy:0xf5c542, watch:0xfb923c, globe:0xc084fc, robot:0x38bdf8, laptop:0x94a3b8 };
    const EMOJIS = [[/money|\$|rich|empire/i,"💸"],[/phone|app/i,"📱"],[/95%|100%|win|celebrate/i,"🏆"],[/2026|world/i,"🌍"],[/waste|hours|watch|time/i,"⏰"],[/ai|system|fast/i,"🚀"]];

    let activeVarIdx = 0, scenes = [], bgPhotos = [], audioBufferUrl = null, audioDurationMs = 0, audioEl = null;
    let animId = null, beatInterval = null, startTime = null, lastSceneIdx = -1, sceneDurationMs = 3200;
    let activeRecorder = null, sharedActx = null, sfxDest = null, analyser = null, freqData = null, prevT = 0;
    let micRecorder = null, micChunks = [], isMicRecording = false, recognition = null;

    const getAudioDur = u => new Promise(r => { const a=new Audio(u); a.onloadedmetadata=()=>r(isFinite(a.duration)?a.duration*1000:0); a.onerror=()=>r(0); });
    const extractStat = t => { const m=t.match(/(\$[\d,.]+[kKmMbB]?|\d+%|\b20\d{2}\b|\b\d+\s?(?:hours|hrs|days|x)\b)/i); return m?m[0].toUpperCase():null; };
    const findEmoji = t => { for(const[rx,em]of EMOJIS) if(rx.test(t)) return em; return null; };

    function matchWordToObj(txt, fallback) {
      if (/money|\$|rich|coin|empire|pay/i.test(txt)) return "coins";
      if (/phone|app|mobile|tiktok/i.test(txt)) return "phone";
      if (/95%|100%|chart|grow|bar|data/i.test(txt)) return "bars";
      if (/win|celebrate|trophy|best/i.test(txt)) return "trophy";
      if (/watch|time|hour|clock|waste/i.test(txt)) return "watch";
      if (/world|global|2026|earth/i.test(txt)) return "globe";
      if (/ai|robot|system|bot/i.test(txt)) return "robot";
      if (/edit|code|laptop|work/i.test(txt)) return "laptop";
      return fallback;
    }

    async function loadUnlimitedWikiPhotos(script) {
      try {
        const kw = script.replace(/[^a-zA-Z\s]/g,"").split(/\s+/).filter(w=>w.length>4).slice(0,2).join(" ") || "technology";
        const d = await (await fetch(`https://en.wikipedia.org/w/api.php?origin=*&format=json&action=query&generator=search&gsrnamespace=0&gsrlimit=6&prop=pageimages&pithumbsize=900&gsrsearch=${encodeURIComponent(kw)}`)).json();
        bgPhotos = Object.values(d?.query?.pages||{}).filter(p=>p.thumbnail?.source).slice(0,4).map(p=>{const i=new Image();i.crossOrigin="anonymous";i.src=p.thumbnail.source;return i;});
      } catch(e){}
    }

    // Mic + Unlimited Free Live Transcription
    micBtn.addEventListener("click", async () => {
      if (isMicRecording) {
        isMicRecording=false; micBtn.classList.remove("recording"); micBtn.textContent="🎙️ Record Voice (Free)";
        if(micRecorder?.state==="recording") micRecorder.stop();
        if(recognition) try{recognition.stop();}catch(e){}
        return;
      }
      try {
        const ms = await navigator.mediaDevices.getUserMedia({audio:true}); micChunks=[]; micRecorder=new MediaRecorder(ms);
        micRecorder.ondataavailable=e=>{if(e.data.size>0)micChunks.push(e.data);};
        micRecorder.onstop=async()=>{
          ms.getTracks().forEach(t=>t.stop());
          audioBufferUrl=URL.createObjectURL(new Blob(micChunks,{type:"audio/webm"}));
          audioDurationMs=await getAudioDur(audioBufferUrl);
          document.getElementById("audioLabel").textContent="✅ Mic Saved";
          statusText.textContent="Voice ready! Tap Generate 4 Videos.";
        };
        micRecorder.start();
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SR) {
          recognition = new SR(); recognition.continuous=true; recognition.lang="en-US"; let tr="";
          recognition.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal){tr+=ev.results[i][0].transcript.trim()+". ";scriptInput.value=tr.trim();}};
          recognition.start();
        }
        isMicRecording=true; micBtn.classList.add("recording"); micBtn.textContent="⏹️ Stop Recording";
        statusText.textContent="Listening... Speak clearly";
      } catch(e){ statusText.textContent="Mic permission blocked"; }
    });

    document.getElementById("audioUpload").addEventListener("change", async e => {
      if (!e.target.files[0]) return;
      audioBufferUrl = URL.createObjectURL(e.target.files[0]);
      audioDurationMs = await getAudioDur(audioBufferUrl);
      document.getElementById("audioLabel").textContent = "✅ " + e.target.files[0].name.slice(0,12);
    });

    function buildScenesFromScript(varIdx) {
      const v = VARIATIONS[varIdx];
      const parts = scriptInput.value.trim().split(/(?<=[.!?؟۔])\s+|\n+/).filter(Boolean);
      const list = parts.length ? parts : ["Paste your script above."];
      scenes = list.map((t, i) => ({
        text: t, stat: extractStat(t),
        show3D: true,
        obj: i === 0 && varIdx === 1 ? "robot" : "auto",
        cam: v.defCam,
        fx: v.defFx,
        customImg: null
      }));
      sceneDurationMs = audioDurationMs > 1000 ? Math.max(2200, (audioDurationMs + 300) / scenes.length) : 3200;
      renderSceneRows();
    }

    // Build Editable Horizontal Scene Rows!
    function renderSceneRows() {
      rowsBox.innerHTML = "";
      scenes.forEach((sc, idx) => {
        const div = document.createElement("div"); div.className = "scene-row";
        div.innerHTML = `
          <div class="scene-head">
            <input type="text" value="${sc.text.replace(/"/g,'&quot;')}" data-idx="${idx}" class="sc-txt" />
            <label class="chk-lbl"><input type="checkbox" ${sc.show3D?"checked":""} data-idx="${idx}" class="sc-chk" /> Show 3D</label>
          </div>
          <div class="row-tools">
            <select data-idx="${idx}" class="sc-obj">
              <option value="auto" ${sc.obj==="auto"?"selected":""}>✨ Auto (Words)</option>
              <option value="robot" ${sc.obj==="robot"?"selected":""}>🤖 3D Robot</option>
              <option value="coins" ${sc.obj==="coins"?"selected":""}>🪙 Coins</option>
              <option value="phone" ${sc.obj==="phone"?"selected":""}>📱 Phone</option>
              <option value="laptop" ${sc.obj==="laptop"?"selected":""}>💻 Laptop</option>
              <option value="bars" ${sc.obj==="bars"?"selected":""}>📊 Chart</option>
              <option value="trophy" ${sc.obj==="trophy"?"selected":""}>🏆 Trophy</option>
              <option value="watch" ${sc.obj==="watch"?"selected":""}>⌚ Watch</option>
              <option value="globe" ${sc.obj==="globe"?"selected":""}>🌍 Globe</option>
            </select>
            <select data-idx="${idx}" class="sc-cam">
              <option value="orbit" ${sc.cam==="orbit"?"selected":""}>🎥 Orbit</option>
              <option value="zoom_in" ${sc.cam==="zoom_in"?"selected":""}>🔍 Zoom In</option>
              <option value="pull_back" ${sc.cam==="pull_back"?"selected":""}>🔭 Pull Back</option>
              <option value="pan" ${sc.cam==="pan"?"selected":""}>↔️ Pan</option>
              <option value="static" ${sc.cam==="static"?"selected":""}>⏹️ Static</option>
            </select>
            <select data-idx="${idx}" class="sc-fx">
              <option value="shockwave" ${sc.fx==="shockwave"?"selected":""}>⚡ Wave</option>
              <option value="flash" ${sc.fx==="flash"?"selected":""}>💥 Flash</option>
              <option value="glitch" ${sc.fx==="glitch"?"selected":""}>📺 Glitch</option>
              <option value="none" ${sc.fx==="none"?"selected":""}>No FX</option>
            </select>
            <label class="pic-btn"><input type="file" accept="image/*" data-idx="${idx}" class="sc-pic" />🖼️ ${sc.customImg?"✅":"Pic"}</label>
          </div>`;
        rowsBox.appendChild(div);
      });

      rowsBox.querySelectorAll(".sc-txt").forEach(el => el.oninput = e => {
        const i = +e.target.dataset.idx; scenes[i].text = e.target.value; scenes[i].stat = extractStat(e.target.value);
      });
      rowsBox.querySelectorAll(".sc-chk").forEach(el => el.onchange = e => { scenes[+e.target.dataset.idx].show3D = e.target.checked; });
      rowsBox.querySelectorAll(".sc-obj").forEach(el => el.onchange = e => { scenes[+e.target.dataset.idx].obj = e.target.value; });
      rowsBox.querySelectorAll(".sc-cam").forEach(el => el.onchange = e => { scenes[+e.target.dataset.idx].cam = e.target.value; });
      rowsBox.querySelectorAll(".sc-fx").forEach(el => el.onchange = e => { scenes[+e.target.dataset.idx].fx = e.target.value; });
      rowsBox.querySelectorAll(".sc-pic").forEach(el => el.onchange = e => {
        const f = e.target.files[0]; if (!f) return;
        const img = new Image(); img.src = URL.createObjectURL(f);
        scenes[+e.target.dataset.idx].customImg = img; renderSceneRows();
      });
    }

    document.getElementById("generateBtn").addEventListener("click", async () => {
      variantsCard.style.display = "block";
      editorCard.style.display = "block";
      await loadUnlimitedWikiPhotos(scriptInput.value);
      buildScenesFromScript(activeVarIdx);
      startPlayback(null);
    });

    document.querySelectorAll(".var-card").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".var-card").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeVarIdx = +btn.dataset.var;
        buildScenesFromScript(activeVarIdx);
        startPlayback(null);
      });
    });

    function playWhoosh() {
      if (!sharedActx) return;
      try {
        const now=sharedActx.currentTime,dur=0.22,sz=Math.floor(sharedActx.sampleRate*dur),buf=sharedActx.createBuffer(1,sz,sharedActx.sampleRate),d=buf.getChannelData(0);
        for(let i=0;i<sz;i++)d[i]=(Math.random()*2-1)*Math.sin((i/sz)*Math.PI);
        const src=sharedActx.createBufferSource();src.buffer=buf;const f=sharedActx.createBiquadFilter();f.type="bandpass";
        f.frequency.setValueAtTime(300,now);f.frequency.exponentialRampToValueAtTime(3000,now+0.11);
        const g=sharedActx.createGain();g.gain.setValueAtTime(0.28,now);g.gain.exponentialRampToValueAtTime(0.01,now+dur);
        src.connect(f);f.connect(g);g.connect(sharedActx.destination);if(sfxDest)g.connect(sfxDest);src.start(now);
      } catch(e){}
    }

    function startBgm(bgmName) {
      clearInterval(beatInterval); if (!sharedActx) return;
      let step = 0; const ms = bgmName==="Doc Heartbeat"?650:bgmName==="Cyber Synth"?260:440;
      const tick = () => {
        if (!sharedActx) return;
        try {
          const now=sharedActx.currentTime,o=sharedActx.createOscillator(),g=sharedActx.createGain();
          if(bgmName==="Cyber Synth"){o.type="sawtooth";o.frequency.setValueAtTime([110,130.8,164.8,146.8][step%4],now);g.gain.setValueAtTime(0.05,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.22);}
          else if(bgmName==="Tech Ambient"){o.type="sine";o.frequency.setValueAtTime([220,277.2,329.6][step%3],now);g.gain.setValueAtTime(0.06,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.42);}
          else{o.type="triangle";o.frequency.setValueAtTime(step%4===0?55:49,now);g.gain.setValueAtTime(0.08,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.35);}
          o.connect(g);g.connect(sharedActx.destination);if(sfxDest)g.connect(sfxDest);o.start(now);o.stop(now+0.43);step++;
        } catch(e){}
      };
      tick(); beatInterval = setInterval(tick, ms);
    }

    function updateCamera(cam, p, idx) {
      const ease = 1 - Math.pow(1 - p, 3), dir = idx % 2 === 0 ? 1 : -1;
      let dp = [0, 0.9, 4.0], dl = [0, 0, 0];
      if (cam === "orbit") { const a = (-0.75 + p * 1.5) * dir; dp = [Math.sin(a)*3.7, 0.8 + Math.sin(p*3.14)*0.4, Math.cos(a)*3.7]; }
      else if (cam === "zoom_in") { dp = [0.2*dir, 0.7-ease*0.3, 4.5-ease*2.1]; }
      else if (cam === "pull_back") { dp = [-0.2*dir, 0.4+ease*0.6, 2.2+ease*2.3]; }
      else if (cam === "pan") { dp = [(-1.4+p*2.8)*dir, 0.7, 3.6]; }
      camPos.lerp(new THREE.Vector3(...dp), 0.14); camLook.lerp(new THREE.Vector3(...dl), 0.14);
      threeCam.position.copy(camPos); threeCam.lookAt(camLook);
    }

    function drawFrame(now) {
      if (startTime === null) { startTime = now; prevT = now; }
      const dt = Math.min(0.05, (now - prevT) / 1000); prevT = now;
      const el = Math.max(0, now - startTime), tot = scenes.length * sceneDurationMs;
      const v = VARIATIONS[activeVarIdx];

      if (el >= tot) {
        clearInterval(beatInterval); if (audioEl) audioEl.pause();
        if (activeRecorder?.state === "recording") activeRecorder.stop();
        else statusText.textContent = `Done (${v.name}) — Edit scenes below or Export MP4`;
        return;
      }

      const idx = Math.min(scenes.length - 1, Math.floor(el / sceneDurationMs)), sel = el % sceneDurationMs, p = sel / sceneDurationMs;
      const sc = scenes[idx];
      if (idx !== lastSceneIdx) { lastSceneIdx = idx; if (sc.fx !== "none") playWhoosh(); }

      // Determine active 3-word chunk & auto-match object/environment to the CURRENT WORDS!
      const words = sc.text.split(" ");
      const chunks = []; for (let i = 0; i < words.length; i += 3) chunks.push(words.slice(i, i + 3));
      const cIdx = Math.min(chunks.length - 1, Math.floor(p * chunks.length)), ac = chunks[cIdx] || words;
      const lp = (p * chunks.length) % 1, aw = Math.min(ac.length - 1, Math.floor(lp * ac.length));
      const activeObj = sc.obj === "auto" ? matchWordToObj(ac.join(" "), v.defObj) : sc.obj;
      const envHex = sc.obj === "auto" ? (WORD_ENV_HEX[activeObj] || v.hex) : v.hex;

      // Backdrop + Scene Photo or Auto Wiki Photo
      const g = ctx.createRadialGradient(canvas.width/2, canvas.height*0.4, 20, canvas.width/2, canvas.height/2, canvas.width*0.9);
      g.addColorStop(0, v.glow); g.addColorStop(1, v.bg); ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
      const pic = sc.customImg || bgPhotos[idx % Math.max(1, bgPhotos.length)];
      if (pic && pic.complete && pic.naturalWidth > 0) {
        const scI = Math.max(canvas.width/pic.naturalWidth, canvas.height/pic.naturalHeight) * (1.04 + p*0.1);
        ctx.save(); ctx.globalAlpha = 0.34;
        ctx.drawImage(pic, (canvas.width - pic.naturalWidth*scI)/2, (canvas.height - pic.naturalHeight*scI)/2, pic.naturalWidth*scI, pic.naturalHeight*scI);
        ctx.restore();
      }

      // 3D Stage & Objects (respects Show 3D checkbox!)
      Object.entries(objs3D).forEach(([k, grp]) => {
        grp.visible = sc.show3D && k === activeObj;
        if (grp.visible) grp.rotation.y = el * 0.0018;
      });
      if (botModel) {
        botModel.visible = sc.show3D && activeObj === "robot";
        if (botModel.visible && botMixer) { botMixer.update(dt); playBotAnim(p < 0.5 ? "Dance" : "Wave"); }
      }
      if (sc.show3D) {
        neonMat.color.setHex(envHex); goldMat.color.setHex(envHex); rimL.color.setHex(envHex); propL.color.setHex(envHex);
        grid.material.color.setHex(envHex);
        updateCamera(sc.cam, p, idx);
        threeRenderer.render(threeScene, threeCam);
        ctx.drawImage(threeRenderer.domElement, 0, 0, canvas.width, canvas.height);
      }

      // Scene Transition Effect
      if (sel < 240 && sc.fx !== "none") {
        const t = 1 - sel / 240; ctx.save();
        if (sc.fx === "shockwave") { ctx.strokeStyle = v.accent; ctx.lineWidth = 12*t; ctx.globalAlpha = t*0.8; ctx.beginPath(); ctx.arc(canvas.width/2,canvas.height/2,(1-t)*canvas.width*0.75,0,6.28); ctx.stroke(); }
        else if (sc.fx === "flash") { ctx.fillStyle = v.accent; ctx.globalAlpha = t*0.3; ctx.fillRect(0,0,canvas.width,canvas.height); }
        else { ctx.fillStyle = v.accent; ctx.globalAlpha = t*0.55; for(let i=0;i<4;i++) ctx.fillRect(Math.sin(sel+i)*35,((i*240+sel)%canvas.height),canvas.width,9); }
        ctx.restore();
      }

      // Captions, Stat Badge & Auto Emoji
      const capY = canvas.height * 0.76;
      if (sc.stat) {
        ctx.save(); const sw = canvas.width * 0.44, sx = (canvas.width - sw)/2, sy = capY - 128;
        ctx.fillStyle = v.accent; ctx.beginPath(); ctx.roundRect(sx, sy, sw, 46, 12); ctx.fill();
        ctx.fillStyle = "#07090e"; ctx.font = "900 28px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(sc.stat, canvas.width/2, sy + 23); ctx.restore();
      }

      const em = findEmoji(ac[aw] || "");
      if (em) { const pe = Math.min(1, lp*5); ctx.save(); ctx.font = `${Math.round(58*pe)}px sans-serif`; ctx.textAlign="center"; ctx.fillText(em, canvas.width/2, capY-56-(1-pe)*12); ctx.restore(); }

      ctx.font = "900 46px -apple-system,sans-serif"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
      const ct = ac.join(" ").toUpperCase(), fw = ctx.measureText(ct).width, sf = Math.min(1, (canvas.width*0.86)/Math.max(1, fw+32));
      ctx.save(); ctx.translate(canvas.width/2, capY); ctx.scale(sf, sf);
      let xc = -fw/2; ctx.textAlign = "left";
      ac.forEach((rw, wi) => {
        const w = rw.toUpperCase(), ww = ctx.measureText(w).width;
        if (wi === aw) { ctx.fillStyle = v.accent; ctx.beginPath(); ctx.roundRect(xc-8,-30,ww+16,60,12); ctx.fill(); ctx.fillStyle="#07090e"; ctx.fillText(w,xc,0); }
        else { ctx.lineWidth=10; ctx.strokeStyle="#000"; ctx.strokeText(w,xc,0); ctx.fillStyle="#fff"; ctx.fillText(w,xc,0); }
        xc += ctx.measureText(w + " ").width;
      });
      ctx.restore();

      animId = requestAnimationFrame(drawFrame);
    }

    function startPlayback(recStream = null) {
      cancelAnimationFrame(animId); clearInterval(beatInterval); startTime = null; lastSceneIdx = -1;
      if (!sharedActx) sharedActx = new (window.AudioContext || window.webkitAudioContext)();
      if (sharedActx.state === "suspended") sharedActx.resume();
      if (recStream) { sfxDest = sharedActx.createMediaStreamDestination(); sfxDest.stream.getAudioTracks().forEach(t => recStream.addTrack(t)); }
      else sfxDest = null;

      const v = VARIATIONS[activeVarIdx];
      startBgm(v.bgm);
      statusText.textContent = `Playing Style ${activeVarIdx+1}: ${v.name}`;
      if (audioEl) { audioEl.pause(); audioEl = null; }
      if (audioBufferUrl) {
        audioEl = new Audio(audioBufferUrl);
        try { const s = sharedActx.createMediaElementSource(audioEl); s.connect(sharedActx.destination); if (sfxDest) s.connect(sfxDest); } catch(e){}
        audioEl.play().catch(()=>{});
      }
      animId = requestAnimationFrame(drawFrame);
    }

    document.getElementById("replayBtn").addEventListener("click", () => { if (!scenes.length) buildScenesFromScript(activeVarIdx); startPlayback(null); });
    exportBtn.addEventListener("click", () => {
      if (activeRecorder?.state === "recording") return;
      if (!scenes.length) buildScenesFromScript(activeVarIdx);
      const stream = canvas.captureStream(30); startPlayback(stream);
      const mt = ['video/mp4;codecs="avc1,opus"','video/mp4',"video/webm;codecs=vp8,opus","video/webm"].find(m => MediaRecorder.isTypeSupported(m)) || "";
      const isMp4 = mt.includes("mp4"); exportBtn.disabled = true; statusText.textContent = `Exporting ${isMp4?"MP4":"WebM"}...`;
      const chunks = []; activeRecorder = new MediaRecorder(stream, mt ? {mimeType:mt, videoBitsPerSecond:3500000} : {});
      activeRecorder.ondataavailable = e => { if (e.data?.size > 0) chunks.push(e.data); };
      activeRecorder.onstop = () => {
        clearInterval(beatInterval); const blob = new Blob(chunks, {type:mt||"video/webm"}), a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = isMp4 ? "viral-3d-reel.mp4" : "viral-3d-reel.webm"; a.click();
        exportBtn.disabled = false; activeRecorder = null; statusText.textContent = `Exported ${isMp4?"MP4":"WebM"} (${(blob.size/1024).toFixed(0)} KB)!`;
      };
      activeRecorder.start(250);
    });
  </script>
</body>
</html>
