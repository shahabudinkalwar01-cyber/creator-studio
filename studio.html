<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio v15.2 — 2-Character 3D Director + Multi-Object Camera</title>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <style>
    :root{--bg:#07090e;--card:#10141f;--input:#0a0e17;--border:#21293b;--gold:#f5c542;--text:#f8fafc;--muted:#94a3b8;--green:#10b981;--red:#ef4444;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
    body{background:var(--bg);color:var(--text);padding:14px 12px 46px;}
    .container{max-width:680px;margin:0 auto;}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
    .badge{font-size:11px;font-weight:700;color:var(--gold);border:1px solid rgba(245,197,66,0.4);background:rgba(245,197,66,0.08);padding:5px 11px;border-radius:999px;}
    .back-link{color:var(--muted);text-decoration:none;font-size:0.85rem;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:13px;}
    .step-title{font-size:0.78rem;font-weight:700;color:var(--gold);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:9px;}
    input[type="text"],select,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:10px;font-size:0.9rem;margin-bottom:9px;}
    textarea{min-height:78px;line-height:1.4;resize:vertical;}
    .grid-2,.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;}
    .btn-ai{width:100%;background:linear-gradient(90deg,#f5c542,#fbbf24);color:#07090e;border:none;border-radius:11px;padding:13px;font-size:0.94rem;font-weight:800;cursor:pointer;}
    .btn-ai:disabled,.btn-small:disabled{opacity:0.55;}
    .mic-btn{background:#1f1622;color:#fca5a5;border:1px solid rgba(239,68,68,0.4);border-radius:11px;padding:10px;font-size:0.84rem;font-weight:700;cursor:pointer;}
    .mic-btn.recording{background:var(--red);color:#fff;}
    .upload-mini{display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(245,197,66,0.08);color:var(--gold);border:1.5px dashed var(--gold);border-radius:11px;padding:10px;font-size:0.83rem;font-weight:700;cursor:pointer;}
    input[type="file"]{display:none;}
    .toggle-row{display:flex;justify-content:space-between;align-items:center;background:var(--input);border:1px solid var(--border);border-radius:11px;padding:10px 13px;margin-bottom:9px;font-size:0.83rem;font-weight:600;}
    .btn-remix{width:100%;background:#1e293b;color:var(--gold);border:1px solid var(--gold);border-radius:11px;padding:12px;font-size:0.9rem;font-weight:700;cursor:pointer;}
    canvas{width:100%;aspect-ratio:9/16;max-height:500px;object-fit:contain;background:#000;border-radius:12px;border:1px solid var(--border);display:block;margin:0 auto 12px;}
    .controls-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
    .status{font-size:0.79rem;color:var(--green);flex:1;min-width:170px;}
    .btn-small{background:#1e293b;color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:8px;font-size:0.84rem;font-weight:600;cursor:pointer;}
    .btn-export{background:var(--green);color:#052e16;border:none;}
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <span class="badge">3D DIRECTOR v15.2 • 2 FIGHT/TALK + MULTI-OBJECT</span>

    <div class="card">

  <option value="soldier">🪖 3D Soldier (Human)</option>

          <button class="btn-small" id="replayBtn">Replay</button>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const WORKER_URL="https://viralengine.shahabudinkalwar001.workers.dev";
    const canvas=document.getElementById("previewCanvas"),ctx=canvas.getContext("2d");
    const statusText=document.getElementById("statusText"),topicInput=document.getElementById("topicInput");
    const langSelect=document.getElementById("langSelect"),voiceSelect=document.getElementById("voiceSelect");
    const scriptInput=document.getElementById("scriptInput"),modeSelect=document.getElementById("modeSelect");
    const sceneMode=document.getElementById("sceneMode"),glbSelect=document.getElementById("glbSelect");
    const beatToggle=document.getElementById("beatToggle"),aiMagicBtn=document.getElementById("aiMagicBtn");
    const exportBtn=document.getElementById("exportBtn"),micBtn=document.getElementById("micBtn");

    // --- THREE.JS 3D STAGE ---
    const threeRenderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
    threeRenderer.setSize(540,960); threeRenderer.outputColorSpace=THREE.SRGBColorSpace;
    const threeScene=new THREE.Scene();
    window.scene = threeScene;
    window.THREE = THREE;
    const threeCam=new THREE.PerspectiveCamera(44,540/960,0.1,100);
    const camPos=new THREE.Vector3(0,1.1,4.2), camLook=new THREE.Vector3(0,0.1,0);

    const hemi=new THREE.HemisphereLight(0xffffff,0x111827,1.6);
    const keyL=new THREE.DirectionalLight(0xffffff,2.4); keyL.position.set(3,6,4);
    const rimL=new THREE.DirectionalLight(0xf5c542,2.5); rimL.position.set(-4,4,-3);
    const propL=new THREE.PointLight(0xf5c542,3.2,6); propL.position.set(0,0.4,0.8);
    threeScene.add(hemi,keyL,rimL,propL);

    // 3D Floor + Grid
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,24),new THREE.MeshStandardMaterial({color:0x06080f,roughness:0.25,metalness:0.7,transparent:true,opacity:0.86}));
    floor.rotation.x=-Math.PI/2; floor.position.y=-1.0;
    const grid=new THREE.GridHelper(22,26,0xf5c542,0x1e293b); grid.position.y=-0.99;
    threeScene.add(floor,grid);

    // 3D Table + Multiple 3D Props (Laptop + Gold Coins + Phone + Bars + Trophy)
    const deskGroup=new THREE.Group();
    const darkMat=new THREE.MeshStandardMaterial({color:0x0f172a,roughness:0.3,metalness:0.8});
    const neonMat=new THREE.MeshBasicMaterial({color:0xf5c542});
    const goldMat=new THREE.MeshStandardMaterial({color:0xf5c542,roughness:0.2,metalness:0.9});

    const topSlab=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.08,1.0),darkMat); topSlab.position.set(0,-0.18,0.82);
    const trim=new THREE.Mesh(new THREE.BoxGeometry(2.42,0.025,1.02),neonMat); trim.position.set(0,-0.18,0.82);
    deskGroup.add(topSlab,trim);
    [[-1.08,0.4],[1.08,0.4],[-1.08,1.22],[1.08,1.22]].forEach(([lx,lz])=>{const l=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.82,0.07),darkMat);l.position.set(lx,-0.59,lz);deskGroup.add(l);});

    // Prop 1: 3D Laptop (Center)
    const lapGroup=new THREE.Group(); lapGroup.position.set(0,-0.125,0.82);
    lapGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.66,0.03,0.44),darkMat));
    const lid=new THREE.Mesh(new THREE.BoxGeometry(0.66,0.42,0.025),darkMat); lid.position.set(0,0.21,0.2); lid.rotation.x=-0.3;
    const scr=new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.36),neonMat); scr.position.set(0,0.21,0.18); scr.rotation.x=-0.3; scr.rotation.y=Math.PI;
    lapGroup.add(lid,scr); deskGroup.add(lapGroup);

    // Prop 2: 3D Gold Coin Stack (Left on Desk: x=-0.82)
    const coinGroup=new THREE.Group(); coinGroup.position.set(-0.82,-0.14,0.82);
    for(let c=0;c<5;c++){const cm=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.04,20),goldMat);cm.position.set((c%2)*0.03,c*0.045,0);coinGroup.add(cm);}
    deskGroup.add(coinGroup);

    // Prop 3: 3D Glowing Phone (Right on Desk: x=+0.82)
    const phoneGroup=new THREE.Group(); phoneGroup.position.set(0.82,0.08,0.82); phoneGroup.rotation.y=-0.35;
    phoneGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.24,0.44,0.03),darkMat));
    const pScr=new THREE.Mesh(new THREE.PlaneGeometry(0.2,0.38),neonMat); pScr.position.z=0.017; phoneGroup.add(pScr);
    deskGroup.add(phoneGroup);

    // Prop 4: 3D Rising Chart Bars (Left Floor: x=-1.45)
    const barsGroup=new THREE.Group(); barsGroup.position.set(-1.45,-1.0,0.2);
    for(let b=0;b<4;b++){const bm=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.35+b*0.28,0.16),goldMat);bm.position.set(b*0.22,(0.35+b*0.28)/2,0);barsGroup.add(bm);}
    deskGroup.add(barsGroup);

    // Prop 5: 3D Spinning Trophy (Right Floor: x=+1.45)
    const trophyGroup=new THREE.Group(); trophyGroup.position.set(1.45,-0.35,0.2);
    const cup=new THREE.Mesh(new THREE.OctahedronGeometry(0.26,0),goldMat); trophyGroup.add(cup);
    deskGroup.add(trophyGroup);

    threeScene.add(deskGroup);

    // --- 2 CHARACTER SLOTS ---
    const loader=new GLTFLoader();
    const URLS={robot:"https://jsdelivr.net",soldier:"https://jsdelivr.net"};
const URLS = {
  soldier:     BASE_GLB + "Soldier.glb",
  michelle:    BASE_GLB + "Michelle.glb",
  xbot:        BASE_GLB + "Xbot.glb",
  robot:       BASE_GLB + "RobotExpressive/RobotExpressive.glb",
  fox:         BASE_GLB + "Fox/glTF-Binary/Fox.glb",
  horse:       BASE_GLB + "Horse.glb",
  parrot:      BASE_GLB + "Parrot.glb",
  flamingo:    BASE_GLB + "Flamingo.glb",
  ceo:         BASE_GLB + "Xbot.glb",
  doctor:      BASE_GLB + "Michelle.glb",
  astronaut:   BASE_GLB + "RobotExpressive/RobotExpressive.glb",
  ninja:       BASE_GLB + "Soldier.glb",
  superhero:   BASE_GLB + "Xbot.glb",
  cartoon_kid: BASE_GLB + "Fox/glTF-Binary/Fox.glb",
  police:      BASE_GLB + "Soldier.glb",
  alien:       BASE_GLB + "RobotExpressive/RobotExpressive.glb"
};
    const chars=[
      {model:null,mixer:null,acts:{},cur:"",ready:false},
      {model:null,mixer:null,acts:{},cur:"",ready:false}
    ];

    function loadChar(slot, url, isSoldier) {
      const ch = chars[slot]; ch.ready = false;
      if (ch.model) { threeScene.remove(ch.model); ch.model = null; }
      ch.acts = {}; ch.cur = "";
      loader.load(url, (gltf) => {
        ch.model = gltf.scene;
        if (isSoldier) ch.model.rotation.y = Math.PI;
        const box = new THREE.Box3().setFromObject(ch.model);
        const maxD = Math.max(...box.getSize(new THREE.Vector3()).toArray()) || 1;
        ch.model.scale.setScalar(2.0 / maxD);
        box.setFromObject(ch.model);
        const cen = box.getCenter(new THREE.Vector3());
        ch.model.userData.baseY = -box.min.y - 1.0;
        ch.model.userData.baseX = -cen.x;
        ch.model.userData.baseZ = -cen.z;
        ch.model.position.set(ch.model.userData.baseX, ch.model.userData.baseY, ch.model.userData.baseZ);
        threeScene.add(ch.model);

        ch.mixer = new THREE.AnimationMixer(ch.model);
        gltf.animations.forEach(c => { ch.acts[c.name] = ch.mixer.clipAction(c); });
        ch.ready = true;
        playCharAnim(slot, Object.keys(ch.acts)[0] || "");
        positionCharsForMode();
        if (slot === 0) statusText.textContent = "3D Stage & Multi-Objects Ready!";
      });
    }

    function playCharAnim(slot, name) {
      const ch = chars[slot];
      if (!ch.ready || !ch.acts[name] || ch.cur === name) return;
      if (ch.cur && ch.acts[ch.cur]) ch.acts[ch.cur].fadeOut(0.2);
      ch.acts[name].reset().fadeIn(0.2).play();
      ch.cur = name;
    }

    function positionCharsForMode() {
      const m = sceneMode.value;
      deskGroup.visible = m === "desk";
      if (chars[0].model) {
        const u = chars[0].model.userData;
        if (m === "desk") { chars[0].model.position.set(u.baseX, u.baseY, u.baseZ - 0.12); chars[0].model.rotation.y = glbSelect.value === "soldier" ? Math.PI : 0; }
        else { chars[0].model.position.set(u.baseX - 0.95, u.baseY, u.baseZ); chars[0].model.rotation.y = Math.PI / 2; }
      }
      if (chars[1].model) {
        chars[1].model.visible = m !== "desk";
        const u = chars[1].model.userData;
        chars[1].model.position.set(u.baseX + 0.95, u.baseY, u.baseZ);
        chars[1].model.rotation.y = -Math.PI / 2;
      }
    }
function reloadModels() {
  const isSol = glbSelect.value === "soldier";
  loadChar(0, isSol ? URLS.soldier : URLS.robot, isSol);
  loadChar(1, URLS.robot, false);
}
    reloadModels();
    sceneMode.addEventListener("change", reloadModels);
    glbSelect.addEventListener("change", reloadModels);
    document.getElementById("glbUpload").addEventListener("change", e => {
      const f = e.target.files[0]; if (!f) return;
      document.getElementById("glbLabel").textContent = "✅ " + f.name.slice(0, 10);
      loadChar(0, URLS.robot && URL.createObjectURL(f), false);
    });

    // --- AUDIO & SCRIPT STATE ---
    let aiImages=[],audioBufferUrl=null,audioDurationMs=0,audioEl=null,animId=null,beatInterval=null;
    let scenes=[],scenePlans=[],sceneDurationMs=3400,startTime=null,lastSceneIdx=-1,activeRecorder=null,sharedActx=null,sfxDest=null,analyser=null,freqData=null;
    let micRecorder=null,micChunks=[],isMicRecording=false,activeThemeKey="luxury",activeBgm="Dark Trap",prevT=0;

    const EN_VOICES=["aura-en:zeus","aura-en:orion","aura-en:apollo","aura-en:thalia"];
    const BGM_LIST=["Dark Trap","Cyber Synth","Tech Ambient","Doc Heartbeat"];
    const THEMES={
      luxury:{bg:"#0b0803",accent:"#f5c542",hex:0xf5c542,text:"#ffffff",glow:"rgba(245,197,66,0.38)"},
      crimson:{bg:"#140507",accent:"#ef4444",hex:0xef4444,text:"#ffffff",glow:"rgba(239,68,68,0.38)"},
      cyber:{bg:"#051024",accent:"#38bdf8",hex:0x38bdf8,text:"#f8fafc",glow:"rgba(56,189,248,0.38)"},
      finance:{bg:"#02140d",accent:"#10b981",hex:0x10b981,text:"#ecfdf5",glow:"rgba(16,185,129,0.38)"}
    };
    const EMOJIS=[[/money|cash|\$|rich|empire/i,"💸"],[/fight|punch|rival|beat/i,"🥊"],[/phone|app|mobile/i,"📱"],[/win|trophy|95%|100%/i,"🏆"],[/2026|fast|fire/i,"🔥"],[/waste|hours/i,"⏰"]];

    modeSelect.addEventListener("change",()=>{
      const sh=modeSelect.value==="shorts"; canvas.width=sh?720:1280; canvas.height=sh?1280:720; canvas.style.aspectRatio=sh?"9/16":"16/9";
      threeRenderer.setSize(sh?540:960,sh?960:540); threeCam.aspect=sh?(540/960):(960/540); threeCam.updateProjectionMatrix();
    });
    const getAudioDur=u=>new Promise(r=>{const a=new Audio(u);a.onloadedmetadata=()=>r(isFinite(a.duration)?a.duration*1000:0);a.onerror=()=>r(0);});

    async function loadPhotos(txt,tf){
      try{const res=await fetch(`${WORKER_URL}/images`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({script:txt,style:activeThemeKey})});if(res.ok){const d=await res.json();if(d.images?.length){aiImages=d.images.map(s=>{const i=new Image();i.src=s;return i;});return;}}}catch(e){}
      try{const cq=(tf||txt).replace(/\b(a|an|the|empire|fighting)\b/gi,"").trim()||"city";const d=await(await fetch(`https://en.wikipedia.org/w/api.php?origin=*&format=json&action=query&generator=search&gsrnamespace=0&gsrlimit=6&prop=pageimages&pithumbsize=1000&gsrsearch=${encodeURIComponent(cq)}`)).json();aiImages=Object.values(d?.query?.pages||{}).filter(p=>p.thumbnail?.source).slice(0,3).map(p=>{const i=new Image();i.crossOrigin="anonymous";i.src=p.thumbnail.source;return i;});}catch(e){}
    }
    async function processVoice(blob,lbl){
      audioBufferUrl=URL.createObjectURL(blob);audioDurationMs=await getAudioDur(audioBufferUrl);document.getElementById("audioLabel").textContent=lbl;statusText.textContent="Listening...";
      try{const res=await fetch(`${WORKER_URL}/transcribe`,{method:"POST",body:blob});const d=await res.json();if(res.ok&&d.transcript)scriptInput.value=d.transcript;}catch(e){}
      await loadPhotos(scriptInput.value,topicInput.value);startPlayback(null,false);
    }
    document.getElementById("audioUpload").addEventListener("change",e=>{if(e.target.files[0])processVoice(e.target.files[0],"✅ Audio");});
    micBtn.addEventListener("click",async()=>{
      if(isMicRecording){isMicRecording=false;micBtn.classList.remove("recording");micBtn.textContent="🎙️ Record & Auto-Build";if(micRecorder?.state==="recording")micRecorder.stop();return;}
      try{const ms=await navigator.mediaDevices.getUserMedia({audio:true});micChunks=[];micRecorder=new MediaRecorder(ms);micRecorder.ondataavailable=e=>{if(e.data.size>0)micChunks.push(e.data);};micRecorder.onstop=()=>{ms.getTracks().forEach(t=>t.stop());processVoice(new Blob(micChunks,{type:"audio/webm"}),"✅ Mic");};micRecorder.start();isMicRecording=true;micBtn.classList.add("recording");micBtn.textContent="⏹️ Stop";statusText.textContent="Recording...";}catch(e){statusText.textContent="Mic blocked";}
    });

    aiMagicBtn.addEventListener("click",async()=>{
      const topic=topicInput.value.trim()||"Luxury Watch Empire",lang=langSelect.value,tk=Object.keys(THEMES);
      activeThemeKey=tk[Math.floor(Math.random()*tk.length)];
      let cv=voiceSelect.value;if(cv==="random")cv=EN_VOICES[Math.floor(Math.random()*EN_VOICES.length)];if(lang==="es")cv="aura-es:sirio";

  function triggerDirectorSFX(type) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = (typeof sharedActx !== "undefined" && sharedActx) ? sharedActx : new Ctx();
      if (ctx.state === "suspended") ctx.resume();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      if (type === "punch") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.18);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      } else if (type === "ding") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1320, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      } else {
        osc.type = "sine";
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.2);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
      }

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.36);
    } catch (e) {}
  }

    function generateEditableSceneCards() {
    const scriptEl = document.getElementById("scriptInput");
    const topicEl = document.querySelector("input[type='text']");
    const container = document.getElementById("sceneCardsContainer");
    if (!scriptEl || !container) return;

    const phrases = scriptEl.value
      .split(/(?<=[,.!?])|\b(?=and\b|then\b|on\b|to\b)/i)
      .map(s => s.trim())
      .filter(Boolean);

    let cursor = 0;
    let currentPlace = "studio";

    if (topicEl && topicEl.value) {
      const tLow = topicEl.value.toLowerCase();
      for (const r of SMART_WORD_ENGINE) {
        if (r.place !== "keep" && r.keywords.some(w => tLow.includes(w))) {
          currentPlace = r.place;
          break;
        }
      }
    }

    editableScenes = phrases.map((phrase, idx) => {
      const duration = Math.max(1.3, phrase.split(/\s+/).length * 0.42);
      const lower = phrase.toLowerCase();

      let matched = {
        place: currentPlace,
        mode: "desk",
        emotion: "🧠 Focused",
        move: "💻 Explain",
        camera: "📷 Medium Shot",
        object: "📱 Studio Setup",
        sfx: "pulse"
      };

      for (const rule of SMART_WORD_ENGINE) {
        if (rule.keywords.some(w => lower.includes(w))) {
          const resolvedPlace = rule.place === "keep" ? currentPlace : rule.place;
          currentPlace = resolvedPlace;
          matched = Object.assign({}, rule, { place: resolvedPlace });
          break;
        }
      }

      const item = {
        id: idx,
        text: phrase,
        place: matched.place,
        mode: matched.mode,
        emotion: matched.emotion,
        move: matched.move,
        camera: matched.camera,
        object: matched.object,
        sfx: matched.sfx,
        start: cursor,
        end: cursor + duration
      };
      cursor += duration;
      return item;
    });

    if (editableScenes.length > 0) {
      buildReal3DPlace(editableScenes[0].place);
    }

    const badge = document.getElementById("castMoodBadge");
    if (badge) badge.textContent = "✨ 3D Place: " + currentPlace.toUpperCase() + " | " + editableScenes.length + " Auto-Matched Scenes";

    renderSceneCardsUI();
  }

            </select>
            <button type="button" data-idx="${i}" class="deleteSceneBtn" style="background:#dc2626; color:#fff; border:none; border-radius:5px; padding:3px 7px; font-size:11px; font-weight:700; cursor:pointer;">🗑️</button>
          </div>
        </div>
        <div style="color:#9ca3af; font-size:10px;">${sc.move} | ${sc.camera} | ${sc.object}</div>
        <input data-idx="${i}" class="sceneTextOverride" type="text" value="${sc.text.replace(/"/g, "&quot;")}" style="background:#0f131d; color:#fff; border:1px solid #2b3245; border-radius:5px; padding:5px 8px; font-size:12px; width:100%; box-sizing:border-box;">
      </div>
    `).join("");

    container.querySelectorAll(".scenePlaceOverride").forEach(sel => {
      sel.onchange = function () {
        const idx = Number(this.dataset.idx);
        editableScenes[idx].place = this.value;
        buildReal3DPlace(this.value);
      };
    });

    container.querySelectorAll(".sceneModeOverride").forEach(sel => {
      sel.onchange = function () {
        const idx = Number(this.dataset.idx);
        editableScenes[idx].mode = this.value;
        const mainDropdown = document.getElementById("sceneMode");
        if (mainDropdown) {
          mainDropdown.value = this.value;
          mainDropdown.dispatchEvent(new Event("change"));
        }
      };
    });

    container.querySelectorAll(".sceneTextOverride").forEach(inp => {
      inp.oninput = function () {
        const idx = Number(this.dataset.idx);
        editableScenes[idx].text = this.value;
        const scriptEl = document.getElementById("scriptInput");
        if (scriptEl) scriptEl.value = editableScenes.map(s => s.text).join(" ");
      };
    });

    container.querySelectorAll(".deleteSceneBtn").forEach(btn => {
      btn.onclick = function () {
        const idx = Number(this.dataset.idx);
        editableScenes.splice(idx, 1);
        let cursor = 0;
        editableScenes.forEach(s => {
          const dur = Math.max(1.3, s.text.split(/\s+/).length * 0.42);
          s.start = cursor;
          s.end = cursor + dur;
          cursor += dur;
        });
        const scriptEl = document.getElementById("scriptInput");
        if (scriptEl) scriptEl.value = editableScenes.map(s => s.text).join(" ");
        renderSceneCardsUI();
      };
    });
  }

  // Watch sceneMode changes & play button clicks safely inside <script type="module">
  document.addEventListener("click", function (e) {
    if (e.target && (e.target.id === "remixBtn" || e.target.id === "replayBtn" || e.target.textContent.includes("AI Build"))) {
      setTimeout(() => {
        generateEditableSceneCards();
        const sceneSelect = document.getElementById("sceneMode");
        const t0 = performance.now();
        let lastPlayedSceneId = -1;
        let activePlace = "";

        const watcher = setInterval(() => {
          const elapsed = (performance.now() - t0) / 1000;
          const active = editableScenes.find(s => elapsed >= s.start && elapsed < s.end);

          if (active && active.id !== lastPlayedSceneId) {
            lastPlayedSceneId = active.id;
            triggerDirectorSFX(active.sfx);

            if (active.place !== activePlace) {
              activePlace = active.place;
              buildReal3DPlace(active.place);
            }
          }

          if (editableScenes.length > 0 && elapsed > editableScenes[editableScenes.length - 1].end) {
            clearInterval(watcher);
          }
        }, 120);
      }, 300);
    }
  });

  function initSafeUpgrade() {
    injectCategoryTabs();
    injectStudioUpgradeUI();
    generateEditableSceneCards();
    const scriptEl = document.getElementById("scriptInput");
    if (scriptEl) scriptEl.addEventListener("change", generateEditableSceneCards);
  }

  if (document.readyState === "loading") {
    window.addEventListener("DOMContentLoaded", initSafeUpgrade);
  } else {
    initSafeUpgrade();
  }  let lastAutoDetectedText = "";
  setInterval(function () {
    const el = document.getElementById("scriptInput");
    if (el && el.value !== lastAutoDetectedText) {
      lastAutoDetectedText = el.value;
      generateEditableSceneCards();
    }
  }, 600);
})();
