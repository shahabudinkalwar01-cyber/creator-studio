<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio v15 — Blender 3D GLB + AI Reels</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root{--bg:#07090e;--card:#10141f;--input:#0a0e17;--border:#21293b;--gold:#f5c542;--text:#f8fafc;--muted:#94a3b8;--green:#10b981;--red:#ef4444;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
    body{background:var(--bg);color:var(--text);padding:16px 14px 50px;}
    .container{max-width:680px;margin:0 auto;}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
    .badge{font-size:11px;font-weight:700;color:var(--gold);border:1px solid rgba(245,197,66,0.4);background:rgba(245,197,66,0.08);padding:5px 11px;border-radius:999px;}
    .back-link{color:var(--muted);text-decoration:none;font-size:0.85rem;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
    .step-title{font-size:0.8rem;font-weight:700;color:var(--gold);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:10px;}
    input[type="text"],select,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px;font-size:0.92rem;margin-bottom:10px;}
    textarea{min-height:80px;line-height:1.4;resize:vertical;}
    .grid-2,.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
    .btn-ai{width:100%;background:linear-gradient(90deg,#f5c542,#fbbf24);color:#07090e;border:none;border-radius:12px;padding:13px;font-size:0.95rem;font-weight:800;cursor:pointer;}
    .btn-ai:disabled,.btn-small:disabled{opacity:0.55;}
    .mic-btn{background:#1f1622;color:#fca5a5;border:1px solid rgba(239,68,68,0.4);border-radius:12px;padding:11px;font-size:0.85rem;font-weight:700;cursor:pointer;}
    .mic-btn.recording{background:var(--red);color:#fff;border-color:var(--red);}
    .upload-mini{display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(245,197,66,0.08);color:var(--gold);border:1.5px dashed var(--gold);border-radius:12px;padding:11px;font-size:0.84rem;font-weight:700;cursor:pointer;}
    input[type="file"]{display:none;}
    .toggle-row{display:flex;justify-content:space-between;align-items:center;background:var(--input);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:0.84rem;font-weight:600;}
    .btn-remix{width:100%;background:#1e293b;color:var(--gold);border:1px solid var(--gold);border-radius:12px;padding:12px;font-size:0.92rem;font-weight:700;cursor:pointer;}
    canvas{width:100%;aspect-ratio:9/16;max-height:500px;object-fit:contain;background:#000;border-radius:12px;border:1px solid var(--border);display:block;margin:0 auto 12px;}
    .controls-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
    .status{font-size:0.8rem;color:var(--green);flex:1;min-width:170px;}
    .btn-small{background:#1e293b;color:var(--text);border:1px solid var(--border);padding:9px 14px;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer;}
    .btn-export{background:var(--green);color:#052e16;border:none;}
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <span class="badge">BLENDER 3D (.GLB) STUDIO v15</span>
      <a href="index.html" class="back-link">← Home</a>
    </div>

    <div class="card">
      <div class="step-title">1. Voice or Script</div>
      <div class="btn-row">
        <button class="mic-btn" id="micBtn">🎙️ Record & Auto-Build</button>
        <label class="upload-mini"><input type="file" id="audioUpload" accept="audio/*" /><span id="audioLabel">📁 Upload Audio</span></label>
      </div>
      <textarea id="scriptInput">Watch 95% of creators waste 10 hours editing slowly. In 2026, fast AI systems win big. Build a $10,000 empire and celebrate!</textarea>
    </div>

    <div class="card">
      <div class="step-title">⚡ AI Script + Photos + Voice</div>
      <input type="text" id="topicInput" placeholder="Topic (e.g. Luxury Watch Empire, AI Future)" value="Luxury Watch Empire" />
      <div class="grid-2">
        <select id="langSelect">
          <option value="en" selected>🇺🇸 English (AI Voice)</option>
          <option value="es">🇪🇸 Español (AI Voice)</option>
          <option value="roman">🇵🇰 Roman Urdu</option>
          <option value="ur">🇵🇰 اردو (Urdu)</option>
          <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
          <option value="ar">🇸🇦 العربية (Arabic)</option>
        </select>
        <select id="voiceSelect">
          <option value="random" selected>🎲 Random Voice</option>
          <option value="aura-en:zeus">Zeus (Deep)</option>
          <option value="aura-en:orion">Orion (Luxury)</option>
          <option value="aura-en:apollo">Apollo (YouTube)</option>
          <option value="aura-en:thalia">Thalia (Female)</option>
          <option value="aura-es:sirio">Sirio (Spanish)</option>
        </select>
      </div>
      <button class="btn-ai" id="aiMagicBtn">✨ AI Build Blender 3D Movie</button>
    </div>

    <div class="card">
      <div class="step-title">2. Blender 3D Model (.GLB) & Format</div>
      <div class="grid-2">
        <select id="glbSelect">
          <option value="robot" selected>🤖 Blender 3D Robot</option>
          <option value="soldier">🪖 Blender 3D Soldier</option>
          <option value="off">❌ No 3D Model</option>
        </select>
        <label class="upload-mini"><input type="file" id="glbUpload" accept=".glb,.gltf" /><span id="glbLabel">📦 Upload .GLB</span></label>
      </div>
      <div class="grid-2">
        <select id="storyModeSelect">
          <option value="reel" selected>🎬 3D Scene + Emojis</option>
          <option value="chat">💬 Fake Text Story</option>
        </select>
        <select id="modeSelect">
          <option value="shorts" selected>9:16 Reels/Shorts</option>
          <option value="landscape">16:9 YouTube</option>
        </select>
      </div>
      <label class="toggle-row">
        <span>🎵 Auto BGM + Scene SFX</span>
        <input type="checkbox" id="beatToggle" checked style="width:20px;height:20px;" />
      </label>
      <button class="btn-remix" id="remixBtn">🎲 New 3D Camera Angle, Colors & BGM</button>
    </div>

    <div class="card">
      <div class="step-title">3. Live Blender 3D Preview & MP4 Export</div>
      <canvas id="previewCanvas" width="720" height="1280"></canvas>
      <div class="controls-row">
        <span class="status" id="statusText">Loading Blender 3D model...</span>
        <div style="display:flex;gap:8px;">
          <button class="btn-small" id="replayBtn">New Mix</button>
          <button class="btn-small btn-export" id="exportBtn">Export MP4</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const WORKER_URL = "https://viralengine.shahabudinkalwar001.workers.dev";
    const canvas = document.getElementById("previewCanvas"), ctx = canvas.getContext("2d");
    const statusText = document.getElementById("statusText"), topicInput = document.getElementById("topicInput");
    const langSelect = document.getElementById("langSelect"), voiceSelect = document.getElementById("voiceSelect");
    const scriptInput = document.getElementById("scriptInput"), modeSelect = document.getElementById("modeSelect");
    const storyModeSelect = document.getElementById("storyModeSelect"), glbSelect = document.getElementById("glbSelect");
    const beatToggle = document.getElementById("beatToggle"), aiMagicBtn = document.getElementById("aiMagicBtn");
    const exportBtn = document.getElementById("exportBtn"), micBtn = document.getElementById("micBtn");

    // --- THREE.JS BLENDER 3D ENGINE (OFFSCREEN WEBGL) ---
    const threeRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
    threeRenderer.setSize(580, 580);
    threeRenderer.outputColorSpace = THREE.SRGBColorSpace;
    const threeScene = new THREE.Scene();
    const threeCam = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
    threeCam.position.set(0, 1.5, 4.2);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x222233, 1.6);
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.4); keyLight.position.set(3, 5, 4);
    const rimLight = new THREE.DirectionalLight(0xf5c542, 2.2); rimLight.position.set(-4, 3, -3);
    threeScene.add(hemiLight, keyLight, rimLight);

    const loader = new GLTFLoader();
    let threeModel = null, threeMixer = null, threeActions = {}, currentClip = "", threeReady = false, prevThreeTime = 0;

    const GLB_URLS = {
      robot: "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/models/gltf/RobotExpressive/RobotExpressive.glb",
      soldier: "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/models/gltf/Soldier.glb"
    };

    function loadGlbModel(url, label = "Blender 3D Ready!") {
      threeReady = false;
      if (threeModel) { threeScene.remove(threeModel); threeModel = null; }
      threeActions = {}; currentClip = "";
      statusText.textContent = "Loading Blender 3D model...";
      loader.load(url, (gltf) => {
        threeModel = gltf.scene;
        const box = new THREE.Box3().setFromObject(threeModel);
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const sc = 2.1 / maxDim;
        threeModel.scale.setScalar(sc);
        box.setFromObject(threeModel);
        const center = box.getCenter(new THREE.Vector3());
        threeModel.position.set(-center.x, -box.min.y - 0.95, -center.z);
        threeScene.add(threeModel);

        threeMixer = new THREE.AnimationMixer(threeModel);
        gltf.animations.forEach(clip => { threeActions[clip.name] = threeMixer.clipAction(clip); });
        threeReady = true;
        playGlbAnim(Object.keys(threeActions)[0] || "");
        statusText.textContent = `${label} (${Object.keys(threeActions).length} animations)`;
      }, undefined, () => { statusText.textContent = "3D load failed — check internet"; });
    }

    function playGlbAnim(name) {
      if (!threeReady || !threeActions[name] || currentClip === name) return;
      if (currentClip && threeActions[currentClip]) threeActions[currentClip].fadeOut(0.25);
      threeActions[name].reset().fadeIn(0.25).play();
      currentClip = name;
    }

    function matchGlbAnim(text) {
      const keys = Object.keys(threeActions);
      if (!keys.length) return "";
      const find = pat => keys.find(k => pat.test(k));
      if (/fast|speed|run|hurry/i.test(text)) return find(/run/i) || find(/walk/i) || keys[0];
      if (/walk|move|step|2026|future/i.test(text)) return find(/walk/i) || keys[0];
      if (/edit|work|sit|hours|waste/i.test(text)) return find(/sit/i) || find(/idle/i) || keys[0];
      if (/win|celebrate|\$|empire|95%|100%|boom/i.test(text)) return find(/dance|thumbs/i) || find(/jump/i) || keys[0];
      if (/watch|hi|hello|look|secret/i.test(text)) return find(/wave|jump/i) || keys[0];
      return find(/idle|stand/i) || keys[0];
    }

    loadGlbModel(GLB_URLS.robot, "Blender 3D Robot Ready!");
    glbSelect.addEventListener("change", () => {
      if (glbSelect.value === "off") threeReady = false;
      else loadGlbModel(GLB_URLS[glbSelect.value], "Blender 3D Ready!");
    });
    document.getElementById("glbUpload").addEventListener("change", (e) => {
      const f = e.target.files[0]; if (!f) return;
      document.getElementById("glbLabel").textContent = "✅ " + f.name.slice(0, 10);
      loadGlbModel(URL.createObjectURL(f), "Custom Blender .GLB Ready!");
    });

    // --- MAIN STUDIO STATE ---
    let aiImages = [], audioBufferUrl = null, audioDurationMs = 0, audioEl = null;
    let animId = null, beatInterval = null, scenes = [], scenePlans = [], sceneDurationMs = 3300;
    let startTime = null, lastSceneIdx = -1, activeRecorder = null, sharedActx = null, sfxDest = null, analyser = null, freqData = null;
    let micRecorder = null, micChunks = [], isMicRecording = false;
    let activeThemeKey = "luxury", activeBgm = "Dark Trap";

    const EN_VOICES = ["aura-en:zeus","aura-en:orion","aura-en:apollo","aura-en:thalia"];
    const CAMERAS = ["orbit","zoom_in","pullback","pan"];
    const SFX_LIST = ["bass","whoosh","ding","shutter","riser"];
    const BGM_LIST = ["Dark Trap","Cyber Synth","Tech Ambient","Doc Heartbeat"];
    const THEMES = {
      luxury:{bg:"#0b0803",accent:"#f5c542",hex:0xf5c542,text:"#ffffff",glow:"rgba(245,197,66,0.42)"},
      crimson:{bg:"#140507",accent:"#ef4444",hex:0xef4444,text:"#ffffff",glow:"rgba(239,68,68,0.42)"},
      cyber:{bg:"#051024",accent:"#38bdf8",hex:0x38bdf8,text:"#f8fafc",glow:"rgba(56,189,248,0.42)"},
      finance:{bg:"#02140d",accent:"#10b981",hex:0x10b981,text:"#ecfdf5",glow:"rgba(16,185,129,0.42)"}
    };
    const EMOJI_RULES = [
      [/money|cash|\$|rich|wealth|empire/i,"💸"],[/fire|viral|boom|fast/i,"🔥"],
      [/time|hour|watch|clock|wait/i,"⏰"],[/win|best|95%|100%|celebrate/i,"🚀"],
      [/ai|system|smart|tech/i,"🤖"],[/2026|world|future/i,"🌍"],[/waste|fail|stop/i,"❌"]
    ];

    modeSelect.addEventListener("change",()=>{
      const sh=modeSelect.value==="shorts";
      canvas.width=sh?720:1280; canvas.height=sh?1280:720; canvas.style.aspectRatio=sh?"9/16":"16/9";
    });
    const getAudioDurationMs=u=>new Promise(r=>{const a=new Audio(u);a.onloadedmetadata=()=>r(isFinite(a.duration)?a.duration*1000:0);a.onerror=()=>r(0);});

    async function loadPhotos(txt, topicFallback) {
      try {
        const res = await fetch(`${WORKER_URL}/images`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({script:txt,style:activeThemeKey})});
        if (res.ok) { const d = await res.json(); if (d.images?.length) { aiImages = d.images.map(s=>{const i=new Image();i.src=s;return i;}); return; } }
      } catch(e){}
      try {
        const cq = (topicFallback||txt).replace(/\b(a|an|the|sad|crying|empire)\b/gi,"").trim() || "city";
        const d = await (await fetch(`https://en.wikipedia.org/w/api.php?origin=*&format=json&action=query&generator=search&gsrnamespace=0&gsrlimit=6&prop=pageimages&pithumbsize=1000&gsrsearch=${encodeURIComponent(cq)}`)).json();
        const urls = Object.values(d?.query?.pages||{}).filter(p=>p.thumbnail?.source).map(p=>p.thumbnail.source).slice(0,3);
        aiImages = urls.map(u=>{const i=new Image();i.crossOrigin="anonymous";i.src=u;return i;});
      } catch(e){}
    }

    async function processVoice(blob, label) {
      audioBufferUrl = URL.createObjectURL(blob); audioDurationMs = await getAudioDurationMs(audioBufferUrl);
      document.getElementById("audioLabel").textContent = label; statusText.textContent = "Listening...";
      try {
        const res = await fetch(`${WORKER_URL}/transcribe`, {method:"POST",body:blob});
        const d = await res.json(); if (res.ok && d.transcript) scriptInput.value = d.transcript;
      } catch(e){}
      await loadPhotos(scriptInput.value, topicInput.value); startPlayback(null, false);
    }

    document.getElementById("audioUpload").addEventListener("change",e=>{if(e.target.files[0])processVoice(e.target.files[0],"✅ Audio");});
    micBtn.addEventListener("click",async()=>{
      if(isMicRecording){isMicRecording=false;micBtn.classList.remove("recording");micBtn.textContent="🎙️ Record & Auto-Build";if(micRecorder?.state==="recording")micRecorder.stop();return;}
      try{
        const ms=await navigator.mediaDevices.getUserMedia({audio:true}); micChunks=[]; micRecorder=new MediaRecorder(ms);
        micRecorder.ondataavailable=e=>{if(e.data.size>0)micChunks.push(e.data);};
        micRecorder.onstop=()=>{ms.getTracks().forEach(t=>t.stop());processVoice(new Blob(micChunks,{type:"audio/webm"}),"✅ Mic");};
        micRecorder.start();isMicRecording=true;micBtn.classList.add("recording");micBtn.textContent="⏹️ Stop";statusText.textContent="Recording...";
      }catch(e){statusText.textContent="Mic blocked";}
    });

    aiMagicBtn.addEventListener("click",async()=>{
      const topic=topicInput.value.trim()||"Luxury Watch Empire",lang=langSelect.value,tk=Object.keys(THEMES);
      activeThemeKey=tk[Math.floor(Math.random()*tk.length)];
      let cv=voiceSelect.value; if(cv==="random")cv=EN_VOICES[Math.floor(Math.random()*EN_VOICES.length)]; if(lang==="es")cv="aura-es:sirio";
      aiMagicBtn.disabled=true; statusText.textContent="1/3 Writing script...";
      let ok=false;
      try{
        const sr=await fetch(`${WORKER_URL}/script`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topic,lang,tone:activeThemeKey})});
        if(sr.ok){const sd=await sr.json();if(sd.script){scriptInput.value=sd.script;scriptInput.dir=(lang==="ur"||lang==="ar")?"rtl":"ltr";ok=true;}}
      }catch(e){}
      if(!ok) scriptInput.value=`Watch 95% of creators waste 10 hours editing slowly. In 2026, fast AI systems win big. Build a $10,000 ${topic} and celebrate!`;
      statusText.textContent="2/3 Loading photos & AI voice...";
      const jobs=[loadPhotos(scriptInput.value,topic)];
      if(lang==="en"||lang==="es") jobs.push(fetch(`${WORKER_URL}/tts`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:scriptInput.value,voice:cv})}).then(r=>r.ok?r.blob():null).catch(()=>null));
      const res=await Promise.all(jobs);
      if(res[1]){audioBufferUrl=URL.createObjectURL(res[1]);audioDurationMs=await getAudioDurationMs(audioBufferUrl);document.getElementById("audioLabel").textContent="✅ "+cv.split(":")[1].toUpperCase();}
      aiMagicBtn.disabled=false; startPlayback(null,false);
    });

    const extractStat=t=>{const m=t.match(/(\$[\d,.]+[kKmMbB]?|\d+%|\b20\d{2}\b|\b\d+\s?(?:hours|hrs|days|x)\b)/i);return m?m[0].toUpperCase():null;};
    const findEmoji=txt=>{for(const[rx,em]of EMOJI_RULES){if(rx.test(txt))return em;}return null;};

    function buildScenes(rand=false){
      if(rand){const tk=Object.keys(THEMES);activeThemeKey=tk[Math.floor(Math.random()*tk.length)];}
      activeBgm=BGM_LIST[Math.floor(Math.random()*BGM_LIST.length)];
      const isChat=storyModeSelect.value==="chat";
      const parts=isChat?scriptInput.value.trim().split(/\n+/).filter(Boolean):scriptInput.value.trim().split(/(?<=[.!?؟۔])\s+|\n+/).filter(Boolean);
      scenes=(parts.length?parts:["Tap AI Build above."]).map(t=>({text:t,stat:extractStat(t),rtl:/[\u0600-\u06FF]/.test(t)}));
      sceneDurationMs=audioDurationMs>1000?Math.max(2200,(audioDurationMs+300)/scenes.length):3200;
      const cp=[...CAMERAS].sort(()=>Math.random()-0.5),sp=[...SFX_LIST].sort(()=>Math.random()-0.5);
      scenePlans=scenes.map((sc,i)=>({anim:matchGlbAnim(sc.text),cam:cp[i%cp.length],sfx:isChat?"ding":sp[i%sp.length],rotDir:(i%2===0?1:-1)}));
    }

    function getEnergy(el){
      if(analyser&&freqData){analyser.getByteFrequencyData(freqData);let s=0;for(let i=0;i<12;i++)s+=freqData[i];const v=s/(12*255);if(v>0.02)return v;}
      return 0.25+0.2*Math.abs(Math.sin(el*0.006));
    }

    function playSfx(type){
      if(!sharedActx||!beatToggle.checked)return;
      try{
        const now=sharedActx.currentTime,o=sharedActx.createOscillator(),g=sharedActx.createGain();
        o.type=type==="ding"?"sine":type==="riser"?"sawtooth":"sine";
        o.frequency.setValueAtTime(type==="ding"?1760:type==="riser"?90:120,now);
        o.frequency.exponentialRampToValueAtTime(type==="ding"?2637:type==="riser"?440:36,now+0.26);
        g.gain.setValueAtTime(0.22,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.28);
        o.connect(g);g.connect(sharedActx.destination);if(sfxDest)g.connect(sfxDest);o.start(now);o.stop(now+0.3);
      }catch(e){}
    }

    function startBgm(){
      clearInterval(beatInterval);if(!beatToggle.checked||!sharedActx)return;
      let step=0;const ms=activeBgm==="Doc Heartbeat"?650:activeBgm==="Cyber Synth"?260:440;
      const tick=()=>{
        if(!sharedActx)return;
        try{
          const now=sharedActx.currentTime,o=sharedActx.createOscillator(),g=sharedActx.createGain();
          if(activeBgm==="Cyber Synth"){o.type="sawtooth";o.frequency.setValueAtTime([110,130.8,164.8,146.8][step%4],now);g.gain.setValueAtTime(0.05,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.22);}
          else if(activeBgm==="Tech Ambient"){o.type="sine";o.frequency.setValueAtTime([220,277.2,329.6][step%3],now);g.gain.setValueAtTime(0.06,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.42);}
          else{o.type="triangle";o.frequency.setValueAtTime(step%4===0?55:49,now);g.gain.setValueAtTime(0.09,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.35);}
          o.connect(g);g.connect(sharedActx.destination);if(sfxDest)g.connect(sfxDest);o.start(now);o.stop(now+0.43);step++;
        }catch(e){}
      };
      tick();beatInterval=setInterval(tick,ms);
    }

    function drawFrame(now){
      if(startTime===null){startTime=now;prevThreeTime=now;}
      const dt=Math.min(0.05,(now-prevThreeTime)/1000); prevThreeTime=now;
      const el=Math.max(0,now-startTime),tot=scenes.length*sceneDurationMs;
      if(el>=tot){
        clearInterval(beatInterval);if(audioEl)audioEl.pause();
        if(activeRecorder&&activeRecorder.state==="recording")activeRecorder.stop();
        else statusText.textContent=`Done | Anim: ${currentClip||"3D"} | BGM: ${activeBgm}`;
        return;
      }

      const idx=Math.min(scenes.length-1,Math.floor(el/sceneDurationMs)),sel=el%sceneDurationMs,plan=scenePlans[idx],theme=THEMES[activeThemeKey];
      if(idx!==lastSceneIdx){lastSceneIdx=idx;playSfx(plan.sfx);if(plan.anim)playGlbAnim(plan.anim);}
      const p=sel/sceneDurationMs,sc=scenes[idx],en=getEnergy(el);

      // Background + AI/Wiki photo with zoom
      const g=ctx.createRadialGradient(canvas.width/2,canvas.height*0.4,20,canvas.width/2,canvas.height/2,canvas.width*0.9);
      g.addColorStop(0,theme.glow);g.addColorStop(1,theme.bg);ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
      const img=aiImages[idx%Math.max(1,aiImages.length)];
      if(img&&img.complete&&img.naturalWidth>0){
        const z=1.04+p*0.14,scI=Math.max(canvas.width/img.naturalWidth,canvas.height/img.naturalHeight)*z;
        ctx.drawImage(img,(canvas.width-img.naturalWidth*scI)/2,(canvas.height-img.naturalHeight*scI)/2,img.naturalWidth*scI,img.naturalHeight*scI);
        const v=ctx.createLinearGradient(0,0,0,canvas.height);v.addColorStop(0,"rgba(0,0,0,0.35)");v.addColorStop(0.6,"rgba(0,0,0,0.62)");v.addColorStop(1,"rgba(0,0,0,0.88)");
        ctx.fillStyle=v;ctx.fillRect(0,0,canvas.width,canvas.height);
      }

      // Render Real Blender 3D Model (.GLB) & Composite
      if(threeReady && glbSelect.value!=="off" && storyModeSelect.value!=="chat"){
        if(threeMixer) threeMixer.update(dt);
        rimLight.color.setHex(theme.hex);
        const ang = (p - 0.5) * 0.9 * plan.rotDir;
        const dist = plan.cam==="zoom_in" ? 4.4-p*0.9 : plan.cam==="pullback" ? 3.2+p*1.1 : 3.9;
        threeCam.position.set(Math.sin(ang)*dist, 1.35 + Math.sin(p*3.14)*0.35, Math.cos(ang)*dist);
        threeCam.lookAt(0, 0.1, 0);
        threeRenderer.render(threeScene, threeCam);
        const sz = Math.min(canvas.width, canvas.height) * 0.85;
        ctx.drawImage(threeRenderer.domElement, (canvas.width - sz) / 2, canvas.height * 0.04, sz, sz);
      }

      // Captions & Stat Badge
      const isV=canvas.height>canvas.width,capY=canvas.height*0.68;
      if(sc.stat){
        ctx.save();ctx.direction="ltr";const sw=isV?canvas.width*0.48:280,sx=(canvas.width-sw)/2,sy=capY-102;
        ctx.fillStyle=theme.accent;ctx.shadowColor=theme.accent;ctx.shadowBlur=22;ctx.beginPath();ctx.roundRect(sx,sy,sw,52,14);ctx.fill();
        ctx.shadowBlur=0;ctx.fillStyle="#07090e";ctx.font=`900 ${isV?30:34}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(sc.stat,canvas.width/2,sy+26);ctx.restore();
      }

      const words=sc.text.split(" ");ctx.font=`900 ${isV?48:54}px -apple-system,sans-serif`;ctx.textBaseline="middle";ctx.lineJoin="round";
      if(sc.rtl){
        ctx.save();ctx.direction="rtl";ctx.textAlign="center";const h=Math.ceil(words.length/2),ch=p<0.5?words.slice(0,h).join(" "):words.slice(h).join(" ");
        ctx.lineWidth=12;ctx.strokeStyle="#000";ctx.strokeText(ch,canvas.width/2,capY,canvas.width*0.86);ctx.fillStyle=theme.text;ctx.fillText(ch,canvas.width/2,capY,canvas.width*0.86);ctx.restore();
      }else{
        const chunks=[];for(let i=0;i<words.length;i+=3)chunks.push(words.slice(i,i+3));
        const cIdx=Math.min(chunks.length-1,Math.floor(p*chunks.length)),ac=chunks[cIdx]||words,lp=(p*chunks.length)%1,aw=Math.min(ac.length-1,Math.floor(lp*ac.length));
        const ct=ac.join(" ").toUpperCase(),fw=ctx.measureText(ct).width,sf=Math.min(1,(canvas.width*0.86)/Math.max(1,fw+32));
        const em=findEmoji(ac[aw]||"");
        if(em){const pe=Math.min(1,lp*5);ctx.save();ctx.font=`${Math.round(72*pe)}px sans-serif`;ctx.textAlign="center";ctx.fillText(em,canvas.width/2,capY-80-(1-pe)*18);ctx.restore();}
        ctx.save();ctx.translate(canvas.width/2,capY);ctx.scale(sf*(1+en*0.07),sf*(1+en*0.07));
        let xc=-fw/2;ctx.textAlign="left";
        ac.forEach((rw,wi)=>{
          const w=rw.toUpperCase(),ww=ctx.measureText(w).width;
          if(wi===aw){ctx.save();ctx.fillStyle=theme.accent;ctx.beginPath();ctx.roundRect(xc-8,-32,ww+16,64,12);ctx.fill();ctx.restore();ctx.fillStyle="#07090e";ctx.fillText(w,xc,0);}
          else{ctx.lineWidth=10;ctx.strokeStyle="#000";ctx.strokeText(w,xc,0);ctx.fillStyle=theme.text;ctx.fillText(w,xc,0);}
          xc+=ctx.measureText(w+" ").width;
        });
        ctx.restore();
      }

      const bh=canvas.height*0.04;ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,bh);ctx.fillRect(0,canvas.height-bh,canvas.width,bh);
      animId=requestAnimationFrame(drawFrame);
    }

    function startPlayback(recStream=null,rand=false){
      cancelAnimationFrame(animId);clearInterval(beatInterval);buildScenes(rand);startTime=null;lastSceneIdx=-1;
      if(!sharedActx)sharedActx=new(window.AudioContext||window.webkitAudioContext)();
      if(sharedActx.state==="suspended")sharedActx.resume();
      if(!analyser){analyser=sharedActx.createAnalyser();analyser.fftSize=64;freqData=new Uint8Array(analyser.frequencyBinCount);}
      if(recStream){sfxDest=sharedActx.createMediaStreamDestination();sfxDest.stream.getAudioTracks().forEach(t=>recStream.addTrack(t));}else sfxDest=null;
      startBgm(); statusText.textContent=`Playing Blender 3D (${currentClip||"Loading"} | BGM: ${activeBgm})`;
      if(audioEl){audioEl.pause();audioEl=null;}
      if(audioBufferUrl){audioEl=new Audio(audioBufferUrl);try{const s=sharedActx.createMediaElementSource(audioEl);s.connect(analyser);analyser.connect(sharedActx.destination);if(sfxDest)s.connect(sfxDest);}catch(e){}audioEl.play().catch(()=>{});}
      animId=requestAnimationFrame(drawFrame);
    }

    document.getElementById("remixBtn").addEventListener("click",()=>startPlayback(null,true));
    document.getElementById("replayBtn").addEventListener("click",()=>startPlayback(null,true));
    exportBtn.addEventListener("click",()=>{
      if(activeRecorder&&activeRecorder.state==="recording")return;
      const stream=canvas.captureStream(30);startPlayback(stream,false);
      const mp4=['video/mp4;codecs="avc1,opus"','video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4'],webm=["video/webm;codecs=vp8,opus","video/webm;codecs=vp8","video/webm"];
      const mt=[...mp4,...webm].find(m=>MediaRecorder.isTypeSupported(m))||"",isMp4=mt.includes("mp4");
      exportBtn.disabled=true;statusText.textContent=`Exporting ${isMp4?"MP4":"WebM"}...`;
      const chunks=[];activeRecorder=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:3500000}:{});
      activeRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data);};
      activeRecorder.onstop=()=>{clearInterval(beatInterval);const blob=new Blob(chunks,{type:mt||"video/webm"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=isMp4?"blender-3d-reel.mp4":"blender-3d-reel.webm";a.click();exportBtn.disabled=false;activeRecorder=null;statusText.textContent=`Exported ${isMp4?"MP4":"WebM"} (${(blob.size/1024).toFixed(0)} KB)!`;};
      activeRecorder.start(250);
    });
  </script>
</body>
